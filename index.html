<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale's Garden</title>
<meta name="description" content="Whale's Garden —— 把想法养成一片海。">
<meta name="theme-color" content="#0b3053">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/reef.jpg">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="banner">
  <div class="reef">
    <div class="reef-img" aria-hidden="true"></div>
    <div class="reef-veil" aria-hidden="true"></div>
    <nav class="links" id="links" aria-label="外部链接"></nav>
    <div class="bubbles" aria-hidden="true"></div>
  </div>
  <img class="reef-mascot" src="assets/mascot-right.webp" alt="Whale's Garden 吉祥物">
  <div class="banner-bar">
    <h1 class="banner-title" id="site-name">Whale's Garden</h1>
    <p class="tagline" id="tagline"></p>
  </div>
</header>

<main>

  <section class="section section-first">
    <h2>项目</h2>
    <div class="grid" id="projects"></div>
    <p class="empty" id="empty" hidden>这片海域还没有项目 🫧</p>
  </section>

  <section class="section" id="portedSection">
    <h2>转载移植</h2>
    <p class="section-note">别人做的好东西，按它的开源许可接到这片海里来。上游、许可证、版权归属都写在项目页里，一个不落。</p>
    <div class="grid" id="ported"></div>
  </section>

  <section class="section">
    <h2>关于</h2>
    <p class="about-text" id="about"></p>
  </section>

</main>

<footer>
  <span id="footer-text"></span>
  <span class="fish">🐋</span>
</footer>

<script src="projects.js"></script>
<script src="app.js"></script>
</body>
</html>
