<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale's Garden</title>
<meta name="description" content="Whale's Garden —— 把想法养成一片海。">
<meta name="theme-color" content="#0b3053">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/reef.jpg">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="banner">
  <div class="reef">
    <div class="reef-img" aria-hidden="true"></div>
    <div class="reef-veil" aria-hidden="true"></div>
    <nav class="links" id="links" aria-label="外部链接"></nav>
    <div class="bubbles" aria-hidden="true"></div>
  </div>
  <img class="reef-mascot" src="assets/mascot-right.webp" alt="Whale's Garden 吉祥物">
  <div class="banner-bar">
    <h1 class="banner-title" id="site-name">Whale's Garden</h1>
    <p class="tagline" id="tagline"></p>
  </div>
</header>

<main>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab is-on" role="tab" data-tab="projects">项目</button>
    <button class="tab" role="tab" data-tab="mad">音MAD</button>
  </nav>

  <div class="panel" data-panel="projects">

    <section class="section section-first">
      <h2>项目</h2>
      <div class="grid" id="projects"></div>
      <p class="empty" id="empty" hidden>这片海域还没有项目 🫧</p>
    </section>

    <section class="section">
      <h2>关于</h2>
      <p class="about-text" id="about"></p>
    </section>

  </div>

  <div class="panel" data-panel="mad" hidden>
    <section class="section section-first">
      <h2>音MAD · VAPOR SAMPLE</h2>
      <p class="about-text">把 MIDI 拆成音轨，每条音轨用你上传的采样当音色，现场改音符、加效果，最后导出成 WAV。</p>
      <div class="mad-frame-wrap">
        <iframe class="mad-frame" id="madFrame" data-src="/vapor-mad/" title="音MAD / Vapor Sample" loading="lazy"></iframe>
      </div>
      <p class="mad-open"><a href="https://Metara-sama.github.io/vapor-mad/" target="_blank" rel="noopener">在新标签页打开 ↗</a></p>
    </section>
  </div>

</main>

<footer>
  <span id="footer-text"></span>
  <span class="fish">🐋</span>
</footer>

<script src="projects.js"></script>
<script src="app.js"></script>
<script>
(function(){
  var bar = document.getElementById('tabs');
  if (!bar) return;
  bar.addEventListener('click', function(e){
    var b = e.target.closest('.tab');
    if (!b) return;
    var k = b.dataset.tab;
    bar.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('is-on', t === b); });
    document.querySelectorAll('.panel').forEach(function(p){ p.hidden = p.dataset.panel !== k; });
    if (k === 'mad') {
      var f = document.getElementById('madFrame');
      if (f && !f.getAttribute('src')) f.setAttribute('src', f.getAttribute('data-src'));
    }
  });
})();
</script>
</body>
</html>
