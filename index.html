<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whale's Garden</title>
<meta name="description" content="Whale's Garden —— 把想法养成一片海。">
<meta name="theme-color" content="#0b3053">
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#top">
      <img class="brand-logo" src="assets/mascot.webp" alt="Whale's Garden 吉祥物">
      <span class="brand-title" id="site-name">Whale's Garden</span>
    </a>
    <nav class="links" id="links" aria-label="外部链接"></nav>
  </div>
</header>

<main id="top">

  <section class="hero">
    <div class="bubbles" aria-hidden="true"></div>
    <div class="hero-inner">
      <img class="hero-mascot" src="assets/mascot.webp" alt="">
      <p class="tagline" id="tagline"></p>
    </div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2>项目</h2>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="projects"></div>
    <p class="empty" id="empty" hidden>这片海域还没有项目 🫧</p>
  </section>

  <section class="section">
    <h2>关于</h2>
    <p class="about-text" id="about"></p>
  </section>

</main>

<footer>
  <span id="footer-text"></span>
  <span class="fish">🐋</span>
</footer>

<script src="projects.js"></script>
<script src="app.js"></script>
</body>
</html>
