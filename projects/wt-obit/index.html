<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>阵亡通报生成器 · WT Memorial Generator</title>
<style>
:root{
  --ink:#e7ebf2;
  --ink-dim:#8b95a5;
  --line:#1e242d;
  --bg:#0a0c10;
  --bg2:#0f1218;
  --acc:#c6ff3d;
  --acc2:#3ddc97;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(1200px 600px at 15% -10%, #131a22 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #101a16 0%, transparent 55%),
    var(--bg);
  color:var(--ink);
  font:14px/1.6 "Noto Sans CJK SC","PingFang SC","HarmonyOS Sans SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* ---------- topbar ---------- */
.topbar{
  height:54px;display:flex;align-items:center;gap:11px;padding:0 16px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(18,23,30,.95),rgba(10,12,16,.92));
  backdrop-filter:blur(10px);position:sticky;top:0;z-index:30;
}
.tb-mark{
  width:28px;height:28px;display:grid;place-items:center;border-radius:8px;
  background:linear-gradient(145deg,#c6ff3d,#4ade80);color:#0a0c10;font-weight:900;font-size:15px;
  box-shadow:0 0 18px rgba(198,255,61,.35);
}
.tb-name{font-weight:800;letter-spacing:.5px;font-size:15px;display:flex;align-items:center;gap:9px}
.tb-name span{font:600 9.5px/1 var(--mono);letter-spacing:1.6px;color:var(--ink-dim);border:1px solid var(--line);padding:5px 6px;border-radius:5px}
.tb-right{margin-left:auto;font-size:11.5px;color:var(--ink-dim);display:flex;align-items:center;gap:6px;font-family:var(--mono)}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--acc2);box-shadow:0 0 9px var(--acc2);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 358px;align-items:start}
.stage{min-width:0}  /* 防止 grid item 被内容撑开 */
.stage{
  position:sticky;top:54px;height:calc(100vh - 54px);
  overflow:auto;padding:24px 32px 74px;scrollbar-width:thin;
  scrollbar-gutter:stable;
}
.stage-inner{width:100%;margin:0 auto;overflow:hidden;position:relative}
.stage-tools{
  position:fixed;left:16px;bottom:12px;display:flex;align-items:center;gap:8px;
  z-index:15;
}
.stage-tools .ghost{padding:5px 9px;font-size:11px;min-width:30px}
.stage-tools .hint{padding:4px 6px;background:rgba(8,10,14,.72);border-radius:6px}

/* ---------- panel ---------- */
.panel{
  min-width:0;border-left:1px solid var(--line);background:rgba(13,16,21,.72);
  padding:16px 16px 60px;min-height:calc(100vh - 54px);
}
.sec{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px;background:rgba(255,255,255,.012)}
.sec-h{font-size:12px;letter-spacing:1.4px;color:var(--ink-dim);margin-bottom:11px;display:flex;align-items:center;gap:8px;font-family:var(--mono);text-transform:uppercase}
.sec-h b{color:var(--acc);font-size:10.5px;border:1px solid rgba(198,255,61,.35);border-radius:4px;padding:2px 5px;background:rgba(198,255,61,.07)}

.drop{
  position:relative;overflow:hidden;
  border:1.5px dashed #2a323d;border-radius:10px;padding:18px 12px;text-align:center;cursor:pointer;
  transition:.18s;background:rgba(255,255,255,.014);
}
.drop-file{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;cursor:pointer;font-size:0;z-index:3;
}
.drop:hover,.drop.over{border-color:var(--acc);background:rgba(198,255,61,.06);transform:translateY(-1px)}
.drop-ico{font-size:22px;color:var(--acc);line-height:1;margin-bottom:6px}
.drop-t{font-size:13px;font-weight:600}
.drop-s{font-size:11px;color:var(--ink-dim);margin-top:4px}

.thumb-row{display:flex;gap:10px;align-items:center;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.thumb-row[hidden]{display:none}
.mini-tip{font-size:11px;color:#6c7787;margin-top:7px;min-height:14px;line-height:1.5}
.mini-tip.err{color:#ff9a9a}
.mini-tip.ok{color:var(--acc2)}
.thumb-row img{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid #2a323d}
.thumb-meta{font-size:11.5px;color:var(--ink-dim);min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.row{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12px}
.row label{color:var(--ink-dim);flex:0 0 62px;font-family:var(--mono);font-size:11px;letter-spacing:.4px}
.row.tiny{margin-top:8px;align-items:flex-start}
.row.tiny label{flex:0 0 62px}
select,.inp{
  flex:1;min-width:0;background:#0b0f14;color:var(--ink);border:1px solid #262e39;border-radius:8px;
  padding:8px 9px;font-size:12.5px;font-family:inherit;outline:none;transition:.15s;
}
select:focus,.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(198,255,61,.1)}
.inp.sm{padding:6px 8px;font-size:12px}
input[type=range]{
  flex:1;min-width:0;appearance:none;height:3px;border-radius:3px;background:#252d38;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:14px;height:14px;border-radius:50%;background:var(--acc);
  box-shadow:0 0 10px rgba(198,255,61,.6);cursor:pointer;border:2px solid #0b0e12;
}
output{font-family:var(--mono);font-size:10.5px;color:var(--acc);min-width:26px;text-align:right}

.adv{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
.adv summary{cursor:pointer;font-size:11.5px;color:var(--ink-dim);list-style:none;font-family:var(--mono);letter-spacing:.5px}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:"▸ ";color:var(--acc)}
.adv[open] summary::before{content:"▾ "}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid #29313c;color:#a9b3c2;cursor:pointer;transition:.15s;background:rgba(255,255,255,.02)}
.chip:hover{border-color:var(--acc);color:var(--acc);background:rgba(198,255,61,.07)}

.tpls{display:grid;gap:7px}
.tpl{
  min-width:0;text-align:left;padding:9px 11px;border-radius:9px;border:1px solid #262e39;background:#0b0f14;
  color:#c3cbd8;cursor:pointer;font:inherit;font-size:12.5px;transition:.15s;display:flex;align-items:center;gap:9px;
}
.tpl:hover{border-color:#3a4553;transform:translateX(2px)}
.tpl.on{border-color:var(--acc);background:rgba(198,255,61,.08);color:#fff;box-shadow:0 0 0 1px rgba(198,255,61,.25) inset}
.tpl .tp-logo{font:700 10px/1 var(--mono);letter-spacing:.5px;color:var(--ink-dim);border:1px solid #2b3440;border-radius:4px;padding:3px 5px;flex:0 0 auto}
.tpl.on .tp-logo{color:var(--acc);border-color:rgba(198,255,61,.4)}
.tpl .tp-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.btn{
  width:100%;padding:12px;border-radius:10px;border:0;cursor:pointer;font:800 13.5px/1 inherit;letter-spacing:.6px;
  background:linear-gradient(135deg,#c6ff3d,#7ef0a5);color:#08110a;
  box-shadow:0 6px 22px -8px rgba(198,255,61,.7);transition:.16s;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 26px -8px rgba(198,255,61,.85)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:progress;transform:none}
.ghost{
  background:rgba(255,255,255,.05);border:1px solid var(--line);color:#c3cbd8;border-radius:8px;
  padding:6px 11px;font:inherit;font-size:11.5px;cursor:pointer;
}
.ghost:hover{border-color:#3a4553;color:#fff}
.mini{background:none;border:1px solid #2b3440;color:#9aa5b4;border-radius:6px;padding:2px 7px;font-size:10.5px;cursor:pointer}
.mini:hover{color:#ff7d7d;border-color:#5a2a2a}
.hint{font-size:10.5px;color:#6c7787;font-family:var(--mono);letter-spacing:.2px}
.hint code{background:#161c24;padding:1px 4px;border-radius:3px;color:#9fb0c4}
.out-msg{font-size:11.5px;color:var(--acc2);margin-top:8px;min-height:16px;font-family:var(--mono)}
.out-msg.err{color:#ff8b8b}
.shot-wrap{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
.shot-wrap img{width:100%;display:block}

.legal{max-width:1000px;margin:0 auto;padding:18px 22px 40px;font-size:11px;line-height:1.8;color:#5a6472;text-align:center}

/* ================= PAPER / 新闻版面 ================= */
.paper{
  width:820px;flex:0 0 auto;background:#fff;color:#16181d;
  padding:44px 54px 40px;border-radius:2px;
  transform-origin:top left;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.85),0 0 0 1px rgba(255,255,255,.08);
  position:relative;isolation:isolate;
  --brand:#0b3d91;--accent:#b3122b;--muted:#6f757d;--rule:#d9dde3;--body:#22262c;
  --ff-display:Georgia,"Times New Roman","Noto Serif CJK SC","Source Han Serif SC",serif;
  --ff-body:"Noto Serif CJK SC","Source Han Serif SC","Songti SC",Georgia,serif;
}
.paper::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.007) 0 1px,transparent 1px 3px),
    radial-gradient(120% 60% at 50% 0%,rgba(0,0,0,.03),transparent 60%);
  mix-blend-mode:multiply;
}
.paper>*{position:relative;z-index:1}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:10px}
.logotype{font:800 34px/1 Georgia,"Times New Roman",serif;letter-spacing:.5px;color:var(--brand)}
.logotype-sub{font-size:11.5px;letter-spacing:2px;color:var(--muted);margin-top:7px;font-family:var(--mono);text-transform:uppercase}
.mast-r{text-align:right;font-size:11.5px;color:#4c525a;line-height:1.75;font-family:var(--mono);letter-spacing:.2px}
.mast-r .muted{color:var(--muted)}
.mast-rule{display:flex;align-items:center;gap:12px;margin:0 0 24px;font-size:11px;letter-spacing:2px;color:#4c525a;font-family:var(--mono);text-transform:uppercase}
.mast-rule .rule-line{flex:1;height:3px;background:var(--brand);opacity:.9}
.mast-rule .rl2{height:1px;background:var(--rule);margin-top:2px}

/* headline */
.catline{display:flex;align-items:center;gap:9px;font-size:12px;letter-spacing:1.4px;color:var(--accent);font-weight:700;margin-bottom:11px;font-family:var(--mono)}
.catline .sp{width:4px;height:4px;background:#c9ced6;border-radius:50%}
.catline .kicker{color:#8a9199;font-weight:500;letter-spacing:.6px}
.cat.flash{background:var(--accent);color:#fff;padding:3px 8px;border-radius:2px;letter-spacing:3px}
.headline{
  font-family:var(--ff-display);font-weight:800;font-size:33px;line-height:1.24;letter-spacing:-.4px;
  margin:0 0 13px;color:#111419;text-wrap:balance;
}
.lead{
  font-family:var(--ff-body);font-size:16px;line-height:1.78;color:#4e545c;margin:0 0 16px;
  padding-left:13px;border-left:3px solid var(--rule);font-weight:400;
}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:11.5px;color:#8a9199;padding:11px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin-bottom:20px;font-family:var(--mono)}
.meta .byl{color:#3f4650;font-weight:600}
.meta .sep{color:#cfd4da}
.meta .views{margin-left:auto;color:#9aa1a9}

/* hero */
.hero{margin:0 0 24px}
.fig-wrap{background:#0e1114;overflow:hidden;line-height:0}
.fig-wrap canvas{width:100%;height:auto;display:block}
.hero figcaption{font-size:11.5px;line-height:1.65;color:#7d848c;margin-top:8px;padding-left:10px;border-left:2px solid var(--rule);font-family:var(--mono)}

/* body */
.article-body{font-family:var(--ff-body);font-size:16.5px;line-height:1.95;color:var(--body)}
.article-body p{margin:0 0 15px;text-indent:2em;text-align:justify}
.article-body p:first-child{text-indent:2em}
.article-body h2{
  font-size:17.5px;line-height:1.5;margin:26px 0 12px;font-weight:800;color:#111419;
  padding-left:11px;border-left:4px solid var(--accent);font-family:"Noto Sans CJK SC",system-ui,sans-serif;
}
.article-body blockquote{
  margin:20px 0;padding:13px 16px;background:#f6f7f9;border-left:3px solid var(--accent);
  font-size:15px;line-height:1.85;color:#3c424a;
}
.article-body blockquote p{text-indent:0;margin:0 0 6px}
.article-body blockquote cite{font-style:normal;font-size:12px;color:#8a9199;display:block;text-align:right;font-family:var(--mono)}
.article-body .num{font-family:var(--mono);font-weight:700;color:#111419}
.article-body strong{font-weight:800}
.article-body .en p{text-indent:0;text-align:left}
.article-body .en:lang(en){text-indent:0}

/* tags & related */
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:26px 0 0;padding-top:16px;border-top:1px dashed var(--rule)}
.tags span{font-size:11.5px;color:#6b727b;background:#f2f4f6;border-radius:3px;padding:3px 8px;font-family:var(--mono)}
.related{margin-top:20px;background:#f7f8fa;border-radius:3px;padding:14px 16px}
.rel-h{font-size:12px;font-weight:800;letter-spacing:1px;color:#4c525a;margin-bottom:9px;font-family:var(--mono);text-transform:uppercase}
.related ul{margin:0;padding:0;list-style:none;font-size:13.5px;line-height:1.9;color:#3c424a}
.related li{padding-left:14px;position:relative}
.related li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;background:var(--accent);opacity:.55}
.copyright{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);font-size:11px;color:#9aa1a9;line-height:1.7;font-family:var(--mono)}

/* ---- themes ---- */
.paper[data-theme="portal"]{
  --brand:#c8102e;--accent:#d81e06;--rule:#e2e4e8;
  --ff-display:"Noto Sans CJK SC","PingFang SC","HarmonyOS Sans SC",system-ui,sans-serif;
  --ff-body:"Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;
}
.paper[data-theme="portal"] .headline{font-weight:900;letter-spacing:-.2px;font-size:31px}
.paper[data-theme="portal"] .logotype{font-family:"Noto Sans CJK SC",system-ui,sans-serif;font-weight:900;letter-spacing:0}
.paper[data-theme="portal"] .article-body{font-size:16.5px}
.paper[data-theme="portal"] .mast-rule .rule-line{height:2px;background:linear-gradient(90deg,var(--brand) 0 18%,#111 18% 100%)}

.paper[data-theme="rt"]{
  --brand:#111419;--accent:#1f9d55;--rule:#e2e4e8;
  --ff-display:Georgia,"Times New Roman",serif;
  --ff-body:Georgia,"Times New Roman","Noto Serif CJK SC",serif;
}
.paper[data-theme="rt"] .logotype{font-family:Georgia,serif;letter-spacing:-1px;font-weight:900}
.paper[data-theme="rt"] .mast-rule .rule-line{height:2px;background:var(--accent)}
.paper[data-theme="rt"] .article-body{font-size:16px;line-height:1.85}
.paper[data-theme="rt"] .article-body p{text-indent:0;text-align:left}

.paper[data-theme="tg"]{
  background:#0f141a;color:#e8eef5;--brand:#3fa9f5;--accent:#3fa9f5;--rule:#232c36;--muted:#7c8796;--body:#d3dde8;
}
.paper[data-theme="tg"] .headline{color:#f2f7fc}
.paper[data-theme="tg"] .lead{color:#a9b7c6}
.paper[data-theme="tg"] .meta{color:#7c8796}
.paper[data-theme="tg"] .meta .byl{color:#dbe6f2}
.paper[data-theme="tg"] .hero figcaption{color:#7c8796}
.paper[data-theme="tg"] .article-body h2{color:#f2f7fc}
.paper[data-theme="tg"] .article-body blockquote{background:#141b23;color:#b8c6d6}
.paper[data-theme="tg"] .tags span{background:#182029;color:#8fa0b3}
.paper[data-theme="tg"] .related{background:#141b23}
.paper[data-theme="tg"] .rel-h,.paper[data-theme="tg"] .related ul{color:#b8c6d6}
.paper[data-theme="tg"] .copyright{color:#6b7887}
.paper[data-theme="tg"]::before{mix-blend-mode:screen;opacity:.4}

.paper[data-theme="ria"]{
  --brand:#12386f;--accent:#c8102e;--rule:#dde1e6;
}
.paper[data-theme="ria"] .logotype{font-family:"Noto Sans CJK SC",system-ui,sans-serif;font-weight:900;letter-spacing:-.6px;font-size:30px}
.paper[data-theme="ria"] .mast-rule .rule-line{height:2px;background:var(--brand)}
.paper[data-theme="ria"] .catline{color:#c8102e}

.paper[data-theme="bbc"]{
  --brand:#bb1919;--accent:#bb1919;--rule:#e6e6e6;
  --ff-display:"Noto Sans CJK SC","PingFang SC","HarmonyOS Sans SC",system-ui,sans-serif;
  --ff-body:"Noto Sans CJK SC","PingFang SC",system-ui,sans-serif;
}
.paper[data-theme="bbc"] .logotype{font-family:"Noto Sans CJK SC",system-ui,sans-serif;font-weight:900;letter-spacing:-1.2px}
.paper[data-theme="bbc"] .mast-rule .rule-line{height:2px;background:#111}
.paper[data-theme="bbc"] .headline{font-weight:800;letter-spacing:-.3px;font-size:31px}
.paper[data-theme="bbc"] .lead{border-left:0;padding-left:0;color:#3c4148;font-size:16.5px;font-weight:500}
.paper[data-theme="bbc"] .article-body p{text-indent:0;text-align:left}
.paper[data-theme="bbc"] .article-body blockquote{background:#f4f4f4;border-left:4px solid #bb1919}

/* ==================================================================
   五种版面结构（wire / portal / rt / bbc / tg）
   ================================================================== */

/* ---------- portal：门户站 ---------- */
.paper[data-layout="portal"]{padding:0}
.p-nav{display:flex;align-items:center;gap:16px;background:#c8102e;color:#fff;padding:0 26px;height:50px}
.p-logo{font-weight:900;font-size:19px;letter-spacing:.5px}
.p-menu{display:flex;gap:14px;font-size:12.5px;opacity:.93}
.p-search{margin-left:auto;font-size:16px;opacity:.9}
.p-main{padding:22px 34px 26px}
.p-crumb{display:flex;align-items:center;gap:9px;font-size:12px;color:#8a9199;margin-bottom:12px}
.p-tag{background:#d81e06;color:#fff;padding:3px 8px;border-radius:2px;font-weight:700;letter-spacing:2px;font-size:11.5px}
.p-title{font-size:30px;line-height:1.32;font-weight:800;letter-spacing:-.2px;margin:0 0 14px;color:#14171b}
.p-lead{font-size:16px;line-height:1.8;color:#5a616a;margin:0 0 14px}
.p-byline{display:flex;gap:14px;font-size:11.5px;color:#8a9199;padding-bottom:14px;border-bottom:1px solid #ececec;margin-bottom:18px}
.p-src{color:#3d434b}
.p-body p{margin:0 0 14px;font-size:16.5px;line-height:1.9;color:#24282e}
.p-body h2{margin:22px 0 10px;font-size:17px;font-weight:800;border-left:4px solid #d81e06;padding-left:10px}
.p-body blockquote{margin:18px 0;padding:12px 14px;background:#f6f7f9;border-left:3px solid #d81e06;font-size:15px;line-height:1.85;color:#3c424a}
.p-body blockquote p{font-size:15px;margin:0 0 6px;color:#3c424a}
.p-body blockquote cite{display:block;text-align:right;font-size:11.5px;color:#8a9199;font-style:normal}
.p-editor{font-size:11.5px;color:#a0a6ae;text-align:right;margin-top:14px}
.p-actbar{display:flex;gap:22px;padding:13px 0;border-top:1px solid #ececec;border-bottom:1px solid #ececec;font-size:12.5px;color:#7a818a}
.p-tags{display:flex;gap:8px;margin:16px 0 0}
.p-tags span{font-size:12px;color:#d81e06;background:#fdf0ef;padding:3px 8px;border-radius:3px}
.p-rel{margin-top:18px;border-top:1px solid #ececec;padding-top:14px}
.p-rel-h{font-size:13px;font-weight:800;margin-bottom:8px;color:#333}
.p-rel ul{margin:0;padding:0;list-style:none}
.p-rel li{font-size:13.5px;line-height:1.95;color:#3c424a;padding-left:12px;position:relative}
.p-rel li::before{content:"";position:absolute;left:0;top:.8em;width:4px;height:4px;background:#d81e06}
.p-copy{margin-top:16px;font-size:11px;color:#a0a6ae}

/* ---------- rt：英文站 ---------- */
.paper[data-layout="rt"]{padding:0}

  function hash(i) {
    let x = (i * 2654435761) >>> 0;
    x ^= x >>> 13;
    x = Math.imul(x, 1274126177) >>> 0;
    return ((x >>> 8) & 0xffff) / 65535;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '"', "'": '&#39;' }[c]));
  }

  /* 把 {{NAME}} 与日期写进文本 */
  function fill(text) {
    const d = state.date;
    const md = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    const dd = d.getDate() + '日';
    const en = EN_MONTH[d.getMonth()] + ' ' + d.getDate();
    const wd = ['日', '一', '二', '三', '四', '五', '六'][d.getDay()];
    return String(text)
      .replace(/\{\{NAME\}\}/g, esc(state.name || '未具名人员'))
      .replace(/11月14日/g, '\u0001')
      .replace(/November 14/g, '\u0002')
      .replace(/on Thursday/g, 'on ' + EN_WEEK[d.getDay()])
      .replace(/14日/g, dd)
      .replace(/\u0001/g, md)
      .replace(/\u0002/g, en)
      .replace(/周[一二三四五六日]/g, '周' + wd);
  }

  /* ---------------- head compositing ---------------- */
  function roundRect(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  function makeMask(W, H, feather, r) {
    const m = document.createElement('canvas');
    m.width = W; m.height = H;
    const c = m.getContext('2d');
    c.fillStyle = '#fff';
    if (feather > 0.4 && typeof c.filter === 'string') {
      c.filter = 'blur(' + feather.toFixed(2) + 'px)';
    }
    roundRect(c, 0, 0, W, H, r);
    c.fill();
    return m;
  }

  function grade(ctx, t) {
    const W = ctx.canvas.width, H = ctx.canvas.height;
    let im;
    try { im = ctx.getImageData(0, 0, W, H); } catch (e) { return; }
    const d = im.data;

    let sum = 0, cnt = 0;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] > 10) { sum += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; cnt++; }
    }
    const avg = cnt ? sum / cnt : 128;
    const target = Math.min(150, Math.max(86, baseLum * 1.30));
    let want = target / Math.max(avg, 1);
    want = Math.min(2.4, Math.max(0.42, want));
    const gain = 1 + (want - 1) * t;

    const sat = 1 - 0.30 * t;
    const con = 1 + 0.06 * t;
    const grain = 12 * t;

    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] === 0) continue;
      let r = d[i], g = d[i + 1], b = d[i + 2];
      const l = 0.299 * r + 0.587 * g + 0.114 * b;
      r = l + (r - l) * sat;
      g = l + (g - l) * sat * 0.95;
      b = l + (b - l) * sat * 0.86;
      r = (r * gain - 128) * con + 128 - 2 * t;
      g = (g * gain - 128) * con + 128 + 1 * t;
      b = (b * gain - 128) * con + 128 - 4 * t;
      const n = (hash(i) - 0.5) * grain;
      d[i] = clamp255(r + n);
      d[i + 1] = clamp255(g + n);
      d[i + 2] = clamp255(b + n * 0.9);
    }
    ctx.putImageData(im, 0, 0);
  }

  /* 采样头像框外围的环境色，用作“底漆”，避免边缘羽化时透出原图痕迹 */
  const ringCache = {};
  function ringColor(ctx, pos) {
    const key = pos.x + ',' + pos.y + ',' + pos.w + ',' + pos.h;
    if (ringCache[key]) return ringCache[key];
    let col = [92, 96, 86];
    try {
      const pad = 22;
      const x0 = Math.max(0, pos.x - pad), y0 = Math.max(0, pos.y - pad);
      const x1 = Math.min(BASE_W, pos.x + pos.w + pad), y1 = Math.min(BASE_H, pos.y + pos.h + pad);
      const w = x1 - x0, h = y1 - y0;
      const d = ctx.getImageData(x0, y0, w, h).data;
      let r = 0, g = 0, b = 0, n = 0;
      const ix0 = pos.x - x0 + 4, iy0 = pos.y - y0 + 4;
      const ix1 = ix0 + pos.w - 8, iy1 = iy0 + pos.h - 8;
      for (let y = 0; y < h; y += 2) {
        for (let x = 0; x < w; x += 2) {
          if (x > ix0 && x < ix1 && y > iy0 && y < iy1) continue;
          const i = (y * w + x) * 4;
          r += d[i]; g += d[i + 1]; b += d[i + 2]; n++;
        }
      }
      if (n) col = [r / n, g / n, b / n];
    } catch (e) { /* getImageData 不可用时用默认色 */ }
    ringCache[key] = col;
    return col;
  }

  function undercoat(ctx, pos) {
    const c = ringColor(ctx, pos);
    const r = Math.round(c[0]), g = Math.round(c[1]), b = Math.round(c[2]);
    ctx.save();
    ctx.beginPath();
    roundRect(ctx, pos.x - 1, pos.y - 1, pos.w + 2, pos.h + 2, pos.r);
    ctx.clip();
    const grd = ctx.createLinearGradient(0, pos.y, 0, pos.y + pos.h);
    grd.addColorStop(0, 'rgb(' + Math.max(0, r - 9) + ',' + Math.max(0, g - 9) + ',' + Math.max(0, b - 10) + ')');
    grd.addColorStop(0.55, 'rgb(' + r + ',' + g + ',' + b + ')');
    grd.addColorStop(1, 'rgb(' + Math.max(0, r + 5) + ',' + Math.max(0, g + 5) + ',' + Math.max(0, b + 3) + ')');
    ctx.fillStyle = grd;
    ctx.fillRect(pos.x - 1, pos.y - 1, pos.w + 2, pos.h + 2);
    ctx.restore();
  }

  let noisePattern = null;
  function finishFilm(ctx) {
    /* 统一色膜：让贴图与实拍共享同一种“胶片特征” */
    ctx.save();
    ctx.globalCompositeOperation = 'overlay';
    ctx.fillStyle = 'rgba(116,132,114,0.07)';
    ctx.fillRect(0, 0, BASE_W, BASE_H);
    ctx.restore();

    /* 暗角 */
    const vg = ctx.createRadialGradient(BASE_W * 0.5, BASE_H * 0.46, BASE_H * 0.30,
      BASE_W * 0.5, BASE_H * 0.5, BASE_W * 0.66);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(0.72, 'rgba(0,0,0,0.05)');
    vg.addColorStop(1, 'rgba(0,0,0,0.24)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, BASE_W, BASE_H);

    /* 颗粒（固定种子，避免拖动时闪烁） */
    if (!noisePattern) {
      try {
        const n = document.createElement('canvas');
        n.width = 128; n.height = 128;
        const nx = n.getContext('2d');
        const d = nx.createImageData(128, 128);
        if (d && d.data) {
          for (let i = 0; i < d.data.length; i += 4) {
            const v = (hash(i) * 255) | 0;
            d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
            d.data[i + 3] = 255;
          }
          nx.putImageData(d, 0, 0);
          noisePattern = ctx.createPattern(n, 'repeat');
        }
      } catch (e) { noisePattern = null; }
    }
    if (noisePattern) {
      ctx.save();
      ctx.globalAlpha = 0.045;
      ctx.globalCompositeOperation = 'overlay';
      ctx.fillStyle = noisePattern;
      ctx.fillRect(0, 0, BASE_W, BASE_H);
      ctx.restore();
    }

    /* 新闻图出处水印 */
    ctx.save();
    ctx.font = '500 32px "Noto Sans CJK SC", system-ui, sans-serif';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(232,238,232,0.24)';
    ctx.fillText('ФОТО: МИНОБОРОНЫ РФ · 国防部新闻处', 30, BASE_H - 30);
    ctx.restore();
  }

  function drawScene() {
    const cv = document.getElementById('scene');
    if (!cv || !cv.getContext) return;
    const ctx = cv.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, BASE_W, BASE_H);
    ctx.filter = 'none';

    if (baseImg) {
      try { ctx.filter = 'saturate(0.94) contrast(1.02)'; } catch (e) { /* 老内核忽略 */ }
      ctx.drawImage(baseImg, 0, 0, BASE_W, BASE_H);
      ctx.filter = 'none';
    } else {
      ctx.fillStyle = '#1b222a';
      ctx.fillRect(0, 0, BASE_W, BASE_H);
    }

    if (headImg) {
      const pos = POSITIONS[state.posKey] || POSITIONS.pos3;
      const t = state.blend / 100;

      undercoat(ctx, pos);

      const layer = document.createElement('canvas');
      layer.width = pos.w; layer.height = pos.h;
      const lc = layer.getContext('2d');
      lc.imageSmoothingEnabled = true;
      lc.imageSmoothingQuality = 'high';

      const s = Math.max(pos.w / headImg.naturalWidth, pos.h / headImg.naturalHeight) * (state.zoom / 100);
      const dw = headImg.naturalWidth * s;
      const dh = headImg.naturalHeight * s;
      const dx = (pos.w - dw) / 2 + pos.w * (state.ox / 100);
      const dy = (pos.h - dh) / 2 + pos.h * (state.oy / 100);
      lc.drawImage(headImg, dx, dy, dw, dh);

      grade(lc, t);

      lc.globalCompositeOperation = 'destination-in';
      lc.drawImage(makeMask(pos.w, pos.h, 9 * t, pos.r), 0, 0);
      lc.globalCompositeOperation = 'source-over';

      /* 贴图边缘的一层极淡投影，让它“压”在照片里 */
      ctx.save();
      ctx.globalAlpha = 0.35 * t;
      ctx.shadowColor = 'rgba(0,0,0,.85)';
      ctx.shadowBlur = 26 * t;
      ctx.shadowOffsetY = 4 * t;
      ctx.drawImage(layer, pos.x, pos.y);
      ctx.restore();

      ctx.globalAlpha = 1;
      ctx.drawImage(layer, pos.x, pos.y);
    }

    finishFilm(ctx);
  }

  /* ---------------- base image ---------------- */
  function loadBase() {
    const img = new Image();
    img.onload = function () {
      baseImg = img;
      try {
        const c = document.createElement('canvas');
        c.width = 64; c.height = 32;
        const cx = c.getContext('2d');
        cx.drawImage(img, 0, 0, 64, 32);
        const d = cx.getImageData(0, 0, 64, 32).data;
        let s = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) { s += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; n++; }
        baseLum = s / Math.max(n, 1);
      } catch (e) { /* ignore */ }
      drawScene();
    };
    img.src = BASE_IMG;
  }

  /* ---------------- fit ---------------- */
  let userZoom = 1;
  let fitRaf = 0;
  let lastScale = -1, lastH = -1;
  function fit() {
    if (fitRaf) return;
    fitRaf = requestAnimationFrame(function () { fitRaf = 0; doFit(); });
  }

  function doFit() {
    const stage = $('stage'), paper = $('paper'), inner = $('stageInner');
    if (!stage || !paper) return;
    const narrow = window.innerWidth <= 980;
    const stageW = Math.min(stage.clientWidth || window.innerWidth || 390, window.innerWidth || 390);
    const pad = narrow ? 20 : 64;
    const avail = Math.max(200, stageW - pad);
    const base = Math.min(1, avail / 820);
    const s = Math.max(0.22, Math.min(3, base * userZoom));
    const h = paper.offsetHeight;
    if (Math.abs(s - lastScale) > 0.0005 || h !== lastH) {
      lastScale = s;
      lastH = h;
      paper.style.transform = Math.abs(s - 1) < 0.001 ? 'none' : 'scale(' + s.toFixed(4) + ')';
      inner.style.width = Math.round(820 * s) + 'px';
      inner.style.height = Math.round(h * s) + 'px';
    }
    const hint = $('stageHint');
    if (hint) hint.textContent = Math.round(s * 100) + '%';
  }

  /* ---------------- head upload ---------------- */
  const TIP_DEFAULT = '选图没反应？请用 Chrome / Edge 打开本页';
  function headTip(msg, type) {
    const el = $('headTip');
    if (!el) return;
    el.className = 'mini-tip' + (type === 'ok' ? ' ok' : type === 'err' ? ' err' : '');
    el.textContent = msg || TIP_DEFAULT;
  }

  function setHead(file) {
    if (!file) return;
    const isImg = (file.type && /^image\//.test(file.type)) ||
      (!file.type && /\.(jpe?g|png|webp|gif|bmp|heic|avif|jfif)$/i.test(file.name || ''));
    if (!isImg) {
      headTip('这不是图片文件：' + (file.name || '未知') + '（' + (file.type || '无类型') + '）', 'err');
      return;
    }
    headTip('读取中…', true);
    const rd = new FileReader();
    rd.onerror = function () { headTip('读取失败，换一张图片试试', 'err'); };
    rd.onload = function () {
      const img = new Image();
      img.onerror = function () { headTip('图片解码失败（可能是 HEIC 格式），请换成 JPG / PNG', 'err'); };
      img.onload = function () {
        headImg = img;
        const row = $('thumbRow');
        row.hidden = false;
        $('thumb').src = img.src;
        $('thumbName').textContent = (file.name || 'pasted.png') + ' · ' + img.naturalWidth + '×' + img.naturalHeight;
        headTip('已载入，可拖「融合度」微调', true);
        drawScene();
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  }

  /* ---------------- shoot ---------------- */
  function shoot() {
    const btn = $('shot'), msg = $('outMsg'), paper = $('paper');
    if (typeof html2canvas !== 'function') { msg.className = 'out-msg err'; msg.textContent = 'html2canvas 未加载'; return; }
    btn.disabled = true;
    msg.className = 'out-msg';
    msg.textContent = '渲染中…';

    const prevT = paper.style.transform;
    const prevS = paper.style.boxShadow;
    const inner = $('stageInner');
    const prevOv = inner.style.overflow;
    paper.style.transform = 'none';
    paper.style.boxShadow = 'none';
    inner.style.overflow = 'visible';

    setTimeout(function () {
      html2canvas(paper, {
        scale: 2,
        backgroundColor: '#ffffff',
        useCORS: true,
        logging: false,
        scrollX: 0, scrollY: 0,
        windowWidth: 1400,
        windowHeight: Math.max(1200, paper.offsetHeight + 200)
      }).then(function (canvas) {
        paper.style.transform = prevT;
        paper.style.boxShadow = prevS;
        inner.style.overflow = prevOv;

        const url = canvas.toDataURL('image/png');
        const wrap = $('shotWrap');
        wrap.hidden = false;
        $('shotImg').src = url;

        const a = document.createElement('a');
        a.href = url;
        a.download = 'WT-obituary-' + (state.name || 'anonymous').replace(/[\\/:*?"<>|\s]/g, '') + '.png';
        document.body.appendChild(a);
        a.click();
        a.remove();

        msg.textContent = '已生成 ' + canvas.width + '×' + canvas.height + ' PNG，下载已触发；长按下方图片亦可保存。';
        btn.disabled = false;
        fit();
        try { wrap.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { }
      }).catch(function (err) {
        paper.style.transform = prevT;
        paper.style.boxShadow = prevS;
        inner.style.overflow = prevOv;
        msg.className = 'out-msg err';
        msg.textContent = '渲染失败：' + (err && err.message ? err.message : err);
        btn.disabled = false;
        fit();
      });
    }, 120);
  }

  /* ---------------- 自定义稿件 ---------------- */
  const LS_KEY = 'wtobit_custom_v1';

  function loadCustom() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) return;
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) arr.forEach(function (a) { a.custom = true; ARTICLES.push(a); });
    } catch (e) { }
  }
  function saveCustom() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(ARTICLES.filter(function (a) { return a.custom; })));
    } catch (e) { }
  }
  function parseBody(text) {
    const out = [];
    String(text || '').split(/\n\s*\n/).forEach(function (block) {
      const b = block.replace(/\r/g, '').trim();
      if (!b) return;
      if (b.indexOf('##') === 0) { out.push({ t: 'h2', v: b.slice(2).trim() }); return; }
      if (b.charAt(0) === '>') {
        const parts = b.slice(1).trim().split('|');
        out.push({ t: 'quote', v: parts[0].trim(), c: (parts[1] || '').trim() });
        return;
      }
      out.push({ t: 'p', v: b.replace(/\n/g, '<br>') });
    });
    return out;
  }
  function bodyText(a) {
    return (a.body || []).map(function (n) {
      if (n.t === 'h2') return '## ' + n.v;
      if (n.t === 'quote') return '> ' + n.v + (n.c ? ' | ' + n.c : '');
      return n.v;
    }).join('\n\n');
  }

  let editingIdx = -1;

  function openEditor(idx) {
    editingIdx = idx;
    const a = idx >= 0 ? ARTICLES[idx] : null;
    $('edLogo').value = a ? a.logo : '军情速览';
    $('edSub').value = a ? (a.logoSub || '') : '环球军事观察 · 24小时滚动';
    $('edCat').value = a ? (a.cat || '') : '突发';
    $('edKicker').value = a ? (a.kicker || '') : '游戏 / 俄乌局势';
    $('edLayout').value = a ? (a.layout || LAYOUT_MAP[a.id] || 'portal') : 'portal';
    $('edTheme').value = a ? a.theme : 'portal';
    $('edHead').value = a ? a.headline : '四名俄方技术顾问在顿涅茨克方向身亡';
    $('edLead').value = a ? a.lead : '据消息人士透露，四人在一处指挥所内遇袭，均当场身亡。';
    $('edBody').value = a ? bodyText(a) : '据本网记者了解，事件发生于当地时间下午，四名技术顾问当时正在一处指挥所内执行例行任务。\n\n通报称，现场已封锁，调查工作正在进行。\n\n## 三名死者在相关项目中任职\n\n四名死者中，三人长期从事模拟训练系统的研发工作，第四人为{{NAME}}。\n\n> 名单里另外三个名字，玩过这款游戏的人大多认识。 |一名在俄华人玩家\n\n截至发稿，相关机构未就此作出回应。';
    $('edAuthor').value = a ? a.author : '本网记者　综合报道';
    $('edCaption').value = a ? a.caption : '事发现场附近。图片来源：受访者提供';
    $('edTags').value = a ? a.tags.join(', ') : '顿涅茨克, 军事';
    $('edRel').value = a ? a.related.join('\n') : '';
    $('edDel').style.display = (a && a.custom) ? '' : 'none';
    $('editor').hidden = false;
    document.body.style.overflow = 'hidden';
  }
  function closeEditor() {
    $('editor').hidden = true;
    document.body.style.overflow = '';
  }
  function saveEditor() {
    const o = {
      id: editingIdx >= 0 ? ARTICLES[editingIdx].id : ('custom' + Date.now()),
      custom: true,
      layout: $('edLayout').value,
      theme: $('edTheme').value,
      logo: $('edLogo').value.trim() || '未命名媒体',
      logoSub: $('edSub').value.trim(),
      place: editingIdx >= 0 ? (ARTICLES[editingIdx].place || '') : '',
      cat: $('edCat').value.trim() || '军事',
      kicker: $('edKicker').value.trim(),
      headline: $('edHead').value.trim() || '（无标题）',
      lead: $('edLead').value.trim(),
      author: $('edAuthor').value.trim() || '本报记者',
      views: '1.2万',
      comments: '36',
      caption: $('edCaption').value.trim(),
      body: parseBody($('edBody').value),
      tags: $('edTags').value.split(/[,，]/).map(function (x) { return x.trim(); }).filter(Boolean),
      related: $('edRel').value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean),
      copyright: '本页面为虚构演绎，与任何真实机构、人物、事件无关。'
    };
    if (!o.body.length) o.body = [{ t: 'p', v: '（正文为空）' }];
    if (editingIdx >= 0) ARTICLES[editingIdx] = o;
    else { ARTICLES.push(o); editingIdx = ARTICLES.length - 1; }
    saveCustom();
    renderTpls();
    state.artIdx = editingIdx;
    renderPaper();
    closeEditor();
  }

  function renderTpls() {
    const tpls = $('tpls');
    tpls.innerHTML = '';
    ARTICLES.forEach(function (a, i) {
      const wrap = document.createElement('div');
      wrap.className = 'tpl-wrap';
      const b = document.createElement('button');
      b.className = 'tpl' + (i === state.artIdx ? ' on' : '');
      b.type = 'button';
      b.style.flex = '1';
      b.innerHTML = '<span class="tp-logo">' + (a.custom ? '★' : String(a.logo).replace(/</g, '&lt;')) + '</span>' +
        '<span class="tp-t">' + String(a.headline || '').replace(/《/g, '「').replace(/》/g, '」') + '</span>';
      b.addEventListener('click', function () {
        state.artIdx = i;
        Array.prototype.forEach.call(tpls.querySelectorAll('.tpl'), function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        renderPaper();
      });
      wrap.appendChild(b);
      if (a.custom) {
        const x = document.createElement('button');
        x.className = 'tpl-x'; x.type = 'button'; x.textContent = '✎'; x.title = '编辑这篇稿件';
        x.addEventListener('click', function (e) { e.stopPropagation(); openEditor(i); });
        wrap.appendChild(x);
      }
      tpls.appendChild(wrap);
    });
  }

  /* ---------------- UI init ---------------- */
  function initUI() {
    /* positions */
    const sel = $('posSel');
    Object.keys(POSITIONS).forEach(function (k) {
      const o = document.createElement('option');
      o.value = k; o.textContent = POSITIONS[k].label;
      sel.appendChild(o);
    });
    sel.value = state.posKey;
    sel.addEventListener('change', function () { state.posKey = sel.value; drawScene(); });

    /* templates */
    renderTpls();

    /* name presets */
    const chips = $('nameChips');
    NAME_PRESETS.forEach(function (n) {
      const c = document.createElement('span');
      c.className = 'chip';
      c.textContent = n;
      c.addEventListener('click', function () {
        $('name').value = n;
        state.name = n;
        renderPaper();
      });
      chips.appendChild(c);
    });

    /* name */
    const nameIn = $('name');
    let nameTimer = null;
    nameIn.addEventListener('input', function () {
      clearTimeout(nameTimer);
      nameTimer = setTimeout(function () {
        state.name = nameIn.value.trim() || '未具名人员';
        renderPaper();
      }, 60);
    });

    /* date */
    const di = $('dateIn');
    di.value = new Date().toISOString().slice(0, 10);
    di.addEventListener('change', function () {
      const p = di.value ? di.value.split('-') : null;
      state.date = p ? new Date(+p[0], +p[1] - 1, +p[2]) : new Date();
      renderPaper();
    });

    /* sliders */
    [['blend', 'blendV', 'blend', drawScene],
     ['zoom', 'zoomV', 'zoom', drawScene],
     ['ox', 'oxV', 'ox', drawScene],
     ['oy', 'oyV', 'oy', drawScene]].forEach(function (cfg) {
      const el = $(cfg[0]), out = $(cfg[1]);
      el.addEventListener('input', function () {
        state[cfg[2]] = +el.value;
        out.textContent = el.value;
        cfg[3]();
      });
    });

    /* upload */
    const drop = $('drop'), file = $('file');
    file.addEventListener('change', function () {
      if (file.files && file.files[0]) setHead(file.files[0]);
      setTimeout(function () { try { file.value = ''; } catch (e) { } }, 0);
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files[0]) setHead(e.dataTransfer.files[0]);
    });
    document.addEventListener('paste', function (e) {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') === 0) {
          const f = items[i].getAsFile();
          if (f) { setHead(f); e.preventDefault(); }
          break;
        }
      }
    });
    $('clearHead').addEventListener('click', function () {
      headImg = null;
      $('thumbRow').hidden = true;
      headTip('');
      drawScene();
    });

    /* editor */
    $('edNew').addEventListener('click', function () { openEditor(-1); });
    $('edClose').addEventListener('click', closeEditor);
    $('edSave').addEventListener('click', saveEditor);
    $('edDel').addEventListener('click', function () {
      if (editingIdx >= 0 && ARTICLES[editingIdx].custom) {
        ARTICLES.splice(editingIdx, 1);
        saveCustom();
        state.artIdx = 0;
        renderTpls();
        renderPaper();
      }
      closeEditor();
    });
    $('editor').addEventListener('click', function (e) { if (e.target === $('editor')) closeEditor(); });

    /* shoot */
    $('shot').addEventListener('click', shoot);
    $('zoomIn').addEventListener('click', function () { userZoom = Math.min(3, userZoom * 1.25); doFit(); });
    $('zoomOut').addEventListener('click', function () { userZoom = Math.max(0.35, userZoom / 1.25); doFit(); });
    $('zoomReset').addEventListener('click', function () { userZoom = 1; doFit(); });

    window.addEventListener('resize', fit);
    if (window.ResizeObserver) {
      new ResizeObserver(function () { fit(); }).observe($('paper'));
    }
  }

  /* ---------------- boot ---------------- */
  function boot() {
    loadCustom();
    initUI();
    loadBase();
    renderPaper();
    /* 布局要等字体/图片/滚动条稳定，多打几枪 */
    [0, 50, 160, 400, 900, 1600].forEach(function (t) { setTimeout(fit, t); });
    window.addEventListener('load', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 260); });
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(function () { fit(); }); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
