<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6">
<title>同人文猎手 · 贴吧 / NGA</title>
<style>
:root{
  --bg:#faf9f6;
  --card:#ffffff;
  --line:#e9e5dc;
  --line2:#f0ede6;
  --ink:#171614;
  --ink2:#857f74;
  --ink3:#b3ada2;
  --accent:#2f5d50;
  --accent-soft:#eef4f1;
  --warn:#a2721c;
  --err:#b23b3b;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif CJK SC",Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--ui);font-size:15px;line-height:1.6;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}

/* 顶部 */
.top{display:flex;align-items:baseline;gap:10px;padding:26px 0 18px}
.top h1{font-size:17px;font-weight:600;letter-spacing:.02em;margin:0}
.top .en{font-size:11px;color:var(--ink3);letter-spacing:.16em;text-transform:uppercase}
.top .right{margin-left:auto;display:flex;gap:14px;align-items:baseline}
.linkbtn{font-size:13px;color:var(--ink2);background:none;border:none;padding:0;
  font-family:var(--ui);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--line)}
.linkbtn:active{color:var(--ink)}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:14px}
.card+.card{margin-top:0}
.sec-label{font-size:11px;color:var(--ink3);letter-spacing:.12em;margin:0 0 10px;text-transform:uppercase}

/* 搜索 */
.field{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;
  padding:12px 13px;font-size:15px;font-family:var(--ui);color:var(--ink);outline:none;
  transition:border-color .15s}
.field::placeholder{color:var(--ink3)}
.field:focus{border-color:var(--accent)}
.field.sm{padding:9px 11px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;
  padding:12px 18px;font-size:14px;font-weight:500;font-family:var(--ui);cursor:pointer;
  transition:opacity .15s}
.btn:active{opacity:.75}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:active{background:#f6f4ef}
.btn.accent{background:var(--accent);border-color:var(--accent)}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:8px}

/* 站点切换 */
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{flex:1;border:none;background:none;padding:9px 4px;font-size:13px;
  font-family:var(--ui);color:var(--ink2);cursor:pointer;transition:.15s}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--ink);color:#fff}

.hint{font-size:12px;color:var(--ink2);line-height:1.65}
.hint.tiny{font-size:11.5px;color:var(--ink3)}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.gap8{margin-top:8px}
.gap10{margin-top:10px}
.gap14{margin-top:14px}

/* 徽标 */
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--ink2);background:#fbfaf7;vertical-align:1px}
.tag.free{border-color:#cfe3d9;background:var(--accent-soft);color:var(--accent)}
.tag.tb{color:#4a6fa5;border-color:#dbe4ef;background:#f4f7fb}
.tag.ng{color:#9a7b3f;border-color:#eee2cc;background:#fdf9f1}

/* 结果 */
.res-item{padding:14px 0;border-top:1px solid var(--line2);cursor:pointer}
.res-item:first-child{border-top:none;padding-top:2px}
.res-item:active .rt{color:var(--accent)}
.rt{font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.45;
  margin:0 0 5px;transition:color .15s}
.rb{font-size:13px;color:var(--ink2);line-height:1.65;margin:0 0 6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rm{font-size:11.5px;color:var(--ink3);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rm b{font-weight:500;color:var(--ink2)}

/* 正文 */
.read-title{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.5;margin:0 0 6px}
.read-meta{font-size:12px;color:var(--ink3);margin:0 0 20px}
.floor{padding:0 0 18px 14px;border-left:1px solid var(--line2);position:relative}
.floor:last-child{border-left-color:transparent}
.floor.op{border-left-color:#cddbd5}
.fh{display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--ink3);
  margin-bottom:5px;flex-wrap:wrap}
.fh .no{font-variant-numeric:tabular-nums}
.fh .au{color:var(--ink2);font-weight:500}
.floor.op .fh .au{color:var(--accent)}
.fh .opf{font-size:10.5px;color:var(--accent);border:1px solid #cfe3d9;
  background:var(--accent-soft);border-radius:4px;padding:0 5px}
.ft{font-family:var(--serif);font-size:15px;line-height:1.95;white-space:pre-wrap;
  word-break:break-word;color:#23221f}
.ft:empty::after{content:"（空）";color:var(--ink3);font-family:var(--ui);font-size:13px}

/* 开关 */
.sw{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;font-size:13.5px}
.sw .box{width:17px;height:17px;border:1px solid #cfc9bd;border-radius:5px;background:#fff;
  flex:0 0 auto;position:relative;transition:.15s}
.sw.on .box{background:var(--accent);border-color:var(--accent)}
.sw.on .box::after{content:"";position:absolute;left:5px;top:1.5px;width:5px;height:9px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}
.sw .lbl{color:var(--ink)}

/* 提示条 */
.msg{font-size:13px;line-height:1.65;padding:11px 13px;border-radius:9px;margin-top:12px;
  border:1px solid var(--line);background:#fbfaf7;color:var(--ink2);word-break:break-word}
.msg.err{border-color:#ecd5d5;background:#fdf6f6;color:var(--err)}
.msg.warn{border-color:#eee2cc;background:#fdfaf3;color:var(--warn)}
.msg.ok{border-color:#cfe3d9;background:var(--accent-soft);color:var(--accent)}
.msg a{color:inherit;text-decoration:underline;text-underline-offset:2px}

/* 进度 */
.line{height:2px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:12px}
.line i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.line.ind i{width:34%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-34%}100%{margin-left:100%}}

/* 底部条 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:10px 20px calc(10px + env(safe-area-inset-bottom));
  background:rgba(250,249,246,.94);border-top:1px solid var(--line);
  backdrop-filter:blur(8px)}
.dock .in{max-width:680px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1}

/* 抽屉 */
.drawer{position:fixed;inset:0;z-index:80;display:none}
.drawer.show{display:block}
.drawer .mask{position:absolute;inset:0;background:rgba(23,22,20,.28)}
.drawer .panel{position:absolute;left:0;right:0;bottom:0;background:#fff;
  border-radius:16px 16px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:88vh;overflow-y:auto;animation:up .22s ease both}
@keyframes up{from{transform:translateY(18px);opacity:.5}to{transform:none;opacity:1}}
.drawer h3{font-size:15px;margin:0 0 4px;font-weight:600}
.drawer .sub2{font-size:12px;color:var(--ink3);margin:0 0 16px}
.ta{width:100%;min-height:64px;border:1px solid var(--line);border-radius:9px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.6;
  color:var(--ink);outline:none;resize:vertical;background:#fff}
.ta:focus{border-color:var(--accent)}
.flabel{font-size:12.5px;color:var(--ink);margin:14px 0 6px;display:flex;gap:6px;align-items:center}

.spin{width:11px;height:11px;border:1.5px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;display:inline-block;animation:sp .65s linear infinite}
.btn.ghost .spin{border-color:#d8d3c9;border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}

.hidden{display:none!important}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:28px 0}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <h1>同人文猎手</h1>
    <span class="en">Tieba · NGA</span>
    <div class="right">
      <button class="linkbtn" id="btnSet">设置</button>
    </div>
  </div>

  <!-- 搜索 -->
  <div class="card">
    <div class="seg" id="seg">
      <button class="on" data-site="tieba">贴吧</button>
      <button data-site="nga">NGA</button>
      <button data-site="both">双站</button>
    </div>
    <input class="field gap10" id="q" placeholder="搜同人文标题或关键词" autocomplete="off" enterkeyhint="search">
    <input class="field sm gap8" id="kw" placeholder="限定某个吧（可留空）" autocomplete="off">
    <div class="row gap10">
      <button class="btn accent" id="btnSearch" style="flex:1">搜索</button>
      <button class="btn ghost sm" id="btnClear">清空</button>
    </div>
    <div class="line hidden" id="sLine"><i></i></div>
    <div id="sMsg"></div>
  </div>

  <!-- 结果 -->
  <div class="card hidden" id="resCard">
    <div class="row" style="margin-bottom:6px">
      <p class="sec-label" style="margin:0">搜索结果</p>
      <span class="hint tiny" id="resCount" style="margin-left:auto"></span>
    </div>
    <div id="resList"></div>
    <button class="btn ghost block sm gap14" id="btnMore">加载更多</button>
  </div>

  <!-- 抓取设置 -->
  <div class="card hidden" id="optCard">
    <p class="sec-label">抓取选项</p>
    <div id="selInfo" class="hint" style="margin-bottom:14px"></div>
    <div class="row" style="gap:18px;flex-wrap:wrap">
      <label class="sw" id="swLz"><span class="box"></span><span class="lbl">仅看楼主</span></label>
      <label class="sw on" id="swName"><span class="box"></span><span class="lbl">显示作者名</span></label>
    </div>
    <div class="row gap14">
      <select class="field sm" id="pages" style="flex:1">
        <option value="1">抓 1 页</option>
        <option value="3" selected>抓 3 页</option>
        <option value="5">抓 5 页</option>
        <option value="10">抓 10 页</option>
        <option value="20">抓 20 页</option>
      </select>
      <button class="btn" id="btnFetch" style="flex:1">抓取正文</button>
    </div>
    <div class="line hidden" id="fLine"><i></i></div>
    <div id="fMsg"></div>
  </div>

  <!-- 正文 -->
  <div class="card hidden" id="readCard">
    <h2 class="read-title" id="readTitle"></h2>
    <p class="read-meta" id="readMeta"></p>
    <div id="floors"></div>
  </div>
</div>

<div class="dock">
  <div class="in">
    <button class="btn ghost sm" id="btnCopy">复制</button>
    <button class="btn ghost sm" id="btnDl">下载 TXT</button>
    <button class="btn sm" id="btnSave">存到手机</button>
  </div>
</div>

<!-- 设置 -->
<div class="drawer" id="drawer">
  <div class="mask" data-close></div>
  <div class="panel">
    <h3>设置</h3>
    <p class="sub2">贴吧搜索已免配置。只有抓正文时才需要登录 Cookie。</p>

    <div class="flabel">贴吧 Cookie <span class="tag">BDUSS</span></div>
    <textarea class="ta" id="ckTb" placeholder="整段粘贴即可，只保留 BDUSS / STOKEN 等关键字段"></textarea>
    <p class="hint tiny gap8">抓正文用。手机浏览器 → 电脑版贴吧 → 任意页面复制 Cookie。</p>

    <div class="flabel">NGA Cookie <span class="tag">ngaPassportUid</span> <span class="tag">ngaPassportCid</span></div>
    <textarea class="ta" id="ckNg" placeholder="整段粘贴即可，自动提取 uid 和 cid"></textarea>
    <p class="hint tiny gap8">NGA 搜索与读帖都必须登录，且账号威望需 &gt; 0。</p>

    <div class="row gap14">
      <button class="btn" id="btnSaveCk" style="flex:1">保存</button>
      <button class="btn ghost" id="btnTest">测试连通</button>
    </div>
    <div id="ckMsg"></div>

    <p class="hint tiny" style="margin-top:20px">Cookie 只存在本机 conf.json，不上传。</p>
  </div>
</div>

<script>
(function(){
"use strict";
var API = location.protocol === "file:" ? "http://127.0.0.1:18660" : (location.origin || "http://127.0.0.1:18660");

var S = {
  site:"tieba", page:1, q:"", items:[], cur:null, floors:[],
  seeLz:false, showName:true, busy:false, lastRes:null, mode:"full"
};

function $(id){ return document.getElementById(id); }
function el(t,c,x){ var n=document.createElement(t); if(c)n.className=c; if(x!=null)n.textContent=x; return n; }
function label(s){ return s==="nga" ? "NGA" : "贴吧"; }
function show(id,on){ $(id).classList.toggle("hidden", !on); }
function line(id,on,ind){
  var b=$(id); b.classList.toggle("hidden",!on); b.classList.toggle("ind",!!ind);
  var i=b.querySelector("i"); if(!on) i.style.width="0"; else if(ind) i.style.width=""; return i;
}
function msg(box,kind,text,link){
  var b=$(box); b.innerHTML="";
  if(!text) return;
  var d=el("div","msg"+(kind?" "+kind:"")); d.textContent=text;
  if(link){
    var a=el("a",null," 查看原始页面"); a.href=link; a.target="_blank";
    d.appendChild(a);
  }
  b.appendChild(d);
}
function json(url,opt){
  return fetch(url,opt).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  });
}

/* ---------- 站点 ---------- */
$("seg").addEventListener("click", function(e){
  var b=e.target.closest("button"); if(!b) return;
  [].forEach.call(this.children,function(c){c.classList.remove("on");});
  b.classList.add("on");
  S.site=b.getAttribute("data-site");
  show("kw", S.site!=="nga");
  if(S.site==="nga") $("kw").value="";
});

/* ---------- 搜索 ---------- */
function doSearch(reset){
  var q=$("q").value.trim();
  if(!q){ $("q").focus(); return; }
  if(S.busy) return;
  S.busy=true; S.q=q;
  if(reset){ S.page=1; S.items=[]; $("resList").innerHTML=""; }

  var btn=$("btnSearch");
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>搜索中';
  line("sLine",true,true); msg("sMsg","","");

  var sites = S.site==="both" ? ["tieba","nga"] : [S.site];
  var kw = S.site==="tieba" ? $("kw").value.trim() : "";
  var urls = sites.map(function(s){
    return API+"/api/search?site="+s+"&q="+encodeURIComponent(q)+
      "&kw="+encodeURIComponent(kw)+"&page="+S.page;
  });

  Promise.all(urls.map(function(u){
    return json(u).catch(function(e){ return {ok:false,error:"请求失败："+e.message,items:[]}; });
  })).then(function(list){
    var add=[], errs=[];
    list.forEach(function(r){
      if(!r || r.ok===false) errs.push(((r&&r.site)?label(r.site)+"：":"")+((r&&r.error)||"未知错误"));
      (r&&r.items||[]).forEach(function(x){ add.push(x); });
    });
    S.items=S.items.concat(add);
    renderResults();
    if(add.length){ show("resCard",true); }
    if(errs.length){
      var t=errs.join("；");
      var needCk=/Cookie|登录|403|2048|威望|验证/.test(t);
      msg("sMsg", needCk?"warn":"err", t+(needCk?"（点右上角「设置」填 Cookie）":""));
    } else if(!add.length){
      msg("sMsg","warn","没有结果。换个关键词试试。");
    } else {
      var free = list.some(function(r){ return r && r.nocookie; });
      if(free) msg("sMsg","ok","贴吧搜索无需登录，已直接取回结果。");
    }
  }).catch(function(e){
    msg("sMsg","err","失败："+e.message);
  }).finally(function(){
    S.busy=false; btn.disabled=false; btn.textContent="搜索";
    line("sLine",false);
  });
}

function renderResults(){
  var box=$("resList"); box.innerHTML="";
  $("resCount").textContent = S.items.length ? S.items.length+" 条" : "";
  S.items.forEach(function(it){
    var d=el("div","res-item");
    d.appendChild(el("p","rt", it.title||"（无标题）"));
    if(it.brief) d.appendChild(el("p","rb", it.brief));
    var m=el("div","rm");
    m.appendChild(el("span","tag "+(it.site==="nga"?"ng":"tb"), label(it.site)));
    if(it.forum) m.appendChild(el("b",null,it.forum));
    if(it.author) m.appendChild(el("span",null,"@"+it.author));
    if(it.date) m.appendChild(el("span",null,it.date));
    if(it.reply) m.appendChild(el("span",null,it.reply+" 楼"));
    d.appendChild(m);
    d.addEventListener("click", function(){ pick(it); });
    box.appendChild(d);
  });
}

$("btnSearch").addEventListener("click", function(){ doSearch(true); });
$("q").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doSearch(true); } });
$("kw").addEventListener("keydown", function(e){ if(e.key==="Enter"){ e.preventDefault(); doSearch(true); } });
$("btnMore").addEventListener("click", function(){
  if(S.busy) return;
  var b=this; b.disabled=true; b.innerHTML='<span class="spin"></span>';
  S.page++;
  var oldLen=S.items.length;
  var done=function(){ b.disabled=false; b.textContent="加载更多"; if(S.items.length===oldLen) msg("sMsg","warn","没有更多了。"); };
  doSearchKeep(done);
});
function doSearchKeep(done){
  var q=S.q||$("q").value.trim();
  if(!q){ done(); return; }
  S.busy=true;
  var sites = S.site==="both" ? ["tieba","nga"] : [S.site];
  var kw = S.site==="tieba" ? $("kw").value.trim() : "";
  line("sLine",true,true);
  Promise.all(sites.map(function(s){
    var u=API+"/api/search?site="+s+"&q="+encodeURIComponent(q)+
      "&kw="+encodeURIComponent(kw)+"&page="+S.page;
    return json(u).catch(function(){ return {ok:false,items:[]}; });
  })).then(function(list){
    var add=[];
    list.forEach(function(r){ (r&&r.items||[]).forEach(function(x){ add.push(x); }); });
    S.items=S.items.concat(add);
    renderResults();
  }).finally(function(){
    S.busy=false; line("sLine",false); done();
  });
}
$("btnClear").addEventListener("click", function(){
  $("q").value=""; $("kw").value="";
  S.items=[]; S.page=1; S.cur=null; S.floors=[];
  $("resList").innerHTML=""; $("resCount").textContent="";
  show("resCard",false); show("optCard",false); show("readCard",false);
  msg("sMsg","","");
});

/* ---------- 选中 ---------- */
function pick(it){
  S.cur=it; S.floors=[];
  show("optCard",true); show("readCard",false);
  $("selInfo").innerHTML="";
  var t=el("span",null,label(it.site)+" · "+(it.title||it.tid));
  $("selInfo").appendChild(t);
  if(it.forum) $("selInfo").appendChild(el("span","tag",it.forum));
  msg("fMsg","","");
  $("optCard").scrollIntoView({behavior:"smooth", block:"center"});
}

/* ---------- 抓取 ---------- */
$("btnFetch").addEventListener("click", function(){
  if(!S.cur){ msg("fMsg","warn","先选一条结果"); return; }
  if(S.busy) return;
  S.busy=true;
  var b=this; b.disabled=true; b.innerHTML='<span class="spin"></span>抓取中';
  line("fLine",true,true); msg("fMsg","","");
  var it=S.cur;
  var u=API+"/api/thread?site="+it.site+"&tid="+encodeURIComponent(it.tid)+
        "&see_lz="+(S.seeLz?1:0)+"&pages="+$("pages").value;

  json(u).then(function(res){
    if(!res || res.ok===false || !(res.floors||[]).length){
      var e=(res&&res.error)||"没有抓到楼层";
      var needCk=/Cookie|登录|403|2048|威望|验证/.test(e);
      var dbg = res&&res.debug ? API+"/api/debug?f="+encodeURIComponent(String(res.debug).split("/").pop()) : null;
      msg("fMsg", needCk?"warn":"err", e+(needCk?"（正文需要登录 Cookie，搜索不需要）":""), dbg);
      // 降级：接口摘要（诚实标注）
      if(it.excerpt){
        S.floors=[{floor:"摘要", author:it.author||"", time:it.date||"",
                   text:"（以下为搜索接口返回的帖子摘要，不是全文）\n\n"+it.excerpt, is_op:true}];
        renderReader({title:it.title, site:it.site, op:it.author||"", floors:S.floors}, true);
      }
      return;
    }
    S.floors=res.floors;
    renderReader(res,false);
    var extra = res.error ? "　⚠ "+res.error : "";
    msg("fMsg","ok","已抓取 "+res.floors.length+" 楼"+
      (res.total_pages?"（原帖共 "+res.total_pages+" 页）":"")+extra);
  }).catch(function(e){
    msg("fMsg","err","请求失败："+e.message+"（服务是否在运行？）");
  }).finally(function(){
    S.busy=false; b.disabled=false; b.textContent="抓取正文"; line("fLine",false);
  });
});

function renderReader(res, isDigest){
  show("readCard",true);
  $("readTitle").textContent = res.title || "";
  var chars=S.floors.reduce(function(a,f){ return a+(f.text?f.text.length:0); },0);
  var meta=label(res.site)+" · 楼主 "+(res.op||"未知")+
    (S.seeLz?" · 仅看楼主":"")+" · "+S.floors.length+" 楼 · 约 "+chars+" 字";
  if(isDigest) meta+=" · 摘要";
  $("readMeta").textContent=meta;

  var box=$("floors"); box.innerHTML="";
  var frag=document.createDocumentFragment();
  S.floors.forEach(function(f){
    var d=el("div","floor"+(f.is_op?" op":""));
    var h=el("div","fh");
    h.appendChild(el("span","no","#"+(f.floor||"?")));
    if(S.showName) h.appendChild(el("span","au",f.author||"匿名"));
    if(f.is_op) h.appendChild(el("span","opf","楼主"));
    if(f.time) h.appendChild(el("span",null,f.time));
    d.appendChild(h);
    d.appendChild(el("div","ft",f.text||""));
    frag.appendChild(d);
  });
  box.appendChild(frag);
  $("readCard").scrollIntoView({behavior:"smooth", block:"start"});
}

/* ---------- 开关 ---------- */
function bindSw(id,key,after){
  $(id).addEventListener("click", function(){
    S[key]=!S[key]; this.classList.toggle("on",S[key]);
    if(after) after();
  });
}
bindSw("swLz","seeLz",function(){
  if(!S.cur) return;
  msg("fMsg", S.seeLz?"warn":"", S.seeLz?"开启「仅看楼主」，重新抓取后生效。":"已关闭「仅看楼主」。");
});
bindSw("swName","showName",function(){
  if(!S.cur || !S.floors.length) return;
  renderReader({title:$("readTitle").textContent, site:S.cur.site, op:(S.cur.author||""),
                floors:S.floors}, $("readMeta").textContent.indexOf("摘要")>=0);
});

/* ---------- 导出 ---------- */
function buildText(){
  if(!S.floors.length) return "";
  var title=S.cur?(S.cur.title||""):$("readTitle").textContent;
  var site=S.cur?S.cur.site:"tieba";
  var url=S.cur?S.cur.url:"";
  var m=$("readMeta").textContent.match(/楼主 (\S+)/);
  var L=[];
  L.push(title);
  L.push("");
  L.push("来源："+label(site)+"　"+url);
  L.push("楼主："+(m?m[1]:"未知")+"　模式："+(S.seeLz?"仅看楼主":"全部楼层"));
  L.push("导出："+fmtNow()+"　楼层："+S.floors.length);
  L.push("");
  L.push("————————————————————————");
  L.push("");
  S.floors.forEach(function(f){
    var head="【#"+(f.floor||"?")+"】";
    if(S.showName) head+=" "+ (f.author||"匿名");
    if(f.time) head+="　"+f.time;
    L.push(head);
    L.push("");
    L.push((f.text||"").replace(/\n{3,}/g,"\n\n"));
    L.push("");
  });
  L.push("————————————————————————");
  L.push("同人文猎手 · 仅供个人阅读存档");
  return L.join("\n");
}
function fmtNow(){
  var d=new Date(), p=function(n){return (n<10?"0":"")+n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function safeName(){
  var t=(S.cur&&S.cur.title)||$("readTitle").textContent||"fanfic";
  return t.replace(/[\\\/:*?"<>|\n\r\t]+/g,"_").slice(0,60);
}
$("btnCopy").addEventListener("click", function(){
  var txt=buildText(); if(!txt){ msg("fMsg","warn","还没有可导出的正文"); return; }
  var ok=function(){ msg("fMsg","ok","已复制（"+txt.length+" 字）"); };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(ok).catch(fb);
  } else fb();
  function fb(){
    var ta=document.createElement("textarea");
    ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); ok(); }catch(e){ msg("fMsg","err","复制失败，请用下载"); }
    document.body.removeChild(ta);
  }
});
$("btnDl").addEventListener("click", function(){
  var txt=buildText(); if(!txt){ msg("fMsg","warn","还没有可导出的正文"); return; }
  var blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=safeName()+".txt";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1200);
  msg("fMsg","ok","已生成 TXT");
});
$("btnSave").addEventListener("click", function(){
  var txt=buildText(); if(!txt){ msg("fMsg","warn","还没有可导出的正文"); return; }
  json(API+"/api/save",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name:safeName()+".txt",content:txt})})
  .then(function(r){
    if(r&&r.ok) msg("fMsg","ok","已保存到 "+r.android_path);
    else msg("fMsg","err","保存失败");
  }).catch(function(e){ msg("fMsg","err","保存失败："+e.message); });
});

/* ---------- 设置 ---------- */
$("btnSet").addEventListener("click", function(){ $("drawer").classList.add("show"); loadConf(); });
$("drawer").addEventListener("click", function(e){
  if(e.target.hasAttribute("data-close")) this.classList.remove("show");
});
function loadConf(){
  json(API+"/api/conf").then(function(c){
    $("ckTb").value=c.tieba_cookie||"";
    $("ckNg").value=c.nga_cookie||"";
  }).catch(function(){});
}
$("btnSaveCk").addEventListener("click", function(){
  json(API+"/api/conf",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tieba_cookie:$("ckTb").value, nga_cookie:$("ckNg").value})})
  .then(function(r){
    if(!r||!r.ok){ msg("ckMsg","err","保存失败"); return; }
    $("ckTb").value=r.conf.tieba_cookie||"";
    $("ckNg").value=r.conf.nga_cookie||"";
    var s=[];
    s.push(r.has_tieba?"贴吧已存":"贴吧空");
    s.push(r.has_nga?"NGA 已存":"NGA 空");
    var bad=[];
    if(r.parsed){
      if(!r.parsed.tieba_cookie && $("ckTb").value) bad.push("贴吧串里没找到 BDUSS");
      if(!r.parsed.nga_cookie && $("ckNg").value) bad.push("NGA 串里缺 uid 或 cid");
    }
    msg("ckMsg", bad.length?"warn":"ok", s.join(" · ")+(bad.length?"　"+bad.join("；"):""));
  }).catch(function(e){ msg("ckMsg","err","保存失败："+e.message); });
});
$("btnTest").addEventListener("click", function(){
  msg("ckMsg","","测试中…");
  Promise.all([
    json(API+"/api/search?site=tieba&q="+encodeURIComponent("同人")+"&page=1").catch(function(e){return {ok:false,error:e.message};}),
    json(API+"/api/search?site=nga&q="+encodeURIComponent("同人")+"&page=1").catch(function(e){return {ok:false,error:e.message};})
  ]).then(function(rs){
    var out=rs.map(function(r,i){
      var n=i===0?"贴吧":"NGA";
      if(r.ok) return n+" 通（"+(r.items||[]).length+" 条）";
      return n+" 不通："+(r.error||"失败");
    });
    var bad=rs.some(function(r){ return !r.ok; });
    msg("ckMsg", bad?"warn":"ok", out.join("　|　"));
  });
});

/* ---------- 启动 ---------- */
json(API+"/api/ping").then(function(){ loadConf(); }).catch(function(){
  msg("sMsg","err","连不上本地服务。请先运行：python3 server.py");
});
})();
</script>
