<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>阈限 · Liminal</title>
<meta name="theme-color" content="#06100f">
<meta name="description" content="梦核 / 池核阈限空间：泳池、后室、草地。按住屏幕走进去。">
<link rel="icon" href="../../assets/favicon.png">
<style>
  :root { --ink: #dff3f6; }
  * { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #05080a;
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overscroll-behavior: none;
  }
  #c {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: #05080a;
    touch-action: none;
  }

  /* ---------- 起幕：呼吸的点 + 进度 ---------- */
  .veil {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 42%, #0d1b1e 0%, #08100f 46%, #040708 100%);
    transition: opacity 1.2s cubic-bezier(.2,.8,.3,1);
    cursor: pointer;
  }
  .veil.gone { opacity: 0; pointer-events: none; }

  .veil-core {
    position: relative;
    width: 64px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orb {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #cfeef1;
    opacity: .45;
    box-shadow: 0 0 12px 2px rgba(190,235,240,.35);
    animation: breathe 3.4s ease-in-out infinite;
    transition: opacity .8s ease, box-shadow .8s ease;
  }
  .veil.ready .orb {
    opacity: .95;
    box-shadow: 0 0 22px 6px rgba(200,245,250,.45);
  }
  .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(200,240,245,.28);
    opacity: 0;
    transform: scale(.3);
  }
  .veil.ready .ring { animation: pulseRing 2.6s cubic-bezier(.2,.6,.3,1) infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(.82); opacity: .35; }
    50% { transform: scale(1.15); opacity: .85; }
  }
  @keyframes pulseRing {
    0% { opacity: .55; transform: scale(.35); }
    70% { opacity: 0; transform: scale(1.9); }
    100% { opacity: 0; transform: scale(1.9); }
  }

  .track {
    position: absolute;
    left: 50%;
    bottom: max(26px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: 148px;
    height: 1px;
    background: rgba(200,235,240,.12);
    overflow: hidden;
  }
  .track i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, rgba(210,245,250,.35), rgba(210,245,250,.95));
    transition: width .25s ease;
  }

  #err {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(78vw, 460px);
    margin-top: 56px;
    font-size: 12.5px;
    line-height: 1.7;
    color: #ffd9d0;
    text-align: center;
    white-space: pre-wrap;
    letter-spacing: .02em;
  }

  /* ---------- 声音开关 ---------- */
  .snd {
    position: fixed;
    right: max(14px, env(safe-area-inset-right, 0px));
    top: max(14px, env(safe-area-inset-top, 0px));
    z-index: 30;
    width: 42px;
    height: 42px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(210,240,245,.20);
    border-radius: 14px;
    background: rgba(10,22,24,.34);
    backdrop-filter: blur(9px) saturate(1.2);
    -webkit-backdrop-filter: blur(9px) saturate(1.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10);
    color: #d8eef2;
    opacity: .42;
    transition: opacity .3s ease, transform .3s ease;
    cursor: pointer;
  }
  .snd:hover { opacity: .9; }
  .snd:active { transform: scale(.94); }
  .snd svg { width: 19px; height: 19px; }
  .snd.off { opacity: .26; }
  .snd.off .wave { display: none; }
  .snd.off::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 1px;
    background: currentColor;
    transform: rotate(-45deg);
    opacity: .8;
  }

  /* ---------- 进入后的呼吸提示（三个扩散环，无文字） ---------- */
  .hint {
    position: fixed;
    left: 50%;
    bottom: 13vh;
    transform: translateX(-50%);
    z-index: 20;
    width: 80px;
    height: 80px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.1s ease;
  }
  .hint.show { opacity: 1; }
  .hint.fade { opacity: 0; }
  .hint i {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(215,245,250,.30);
    opacity: 0;
    animation: hintWave 3.6s cubic-bezier(.2,.6,.3,1) infinite;
  }
  .hint i:nth-child(2) { animation-delay: 1.2s; }
  .hint i:nth-child(3) { animation-delay: 2.4s; }
  @keyframes hintWave {
    0% { opacity: .5; transform: scale(.28); }
    60% { opacity: 0; transform: scale(.95); }
    100% { opacity: 0; transform: scale(.95); }
  }

  @media (prefers-reduced-motion: reduce) {
    .orb, .hint i { animation: none; }
    .veil { transition: opacity .4s linear; }
  }
</style>
</head>
<body style="margin:0;background:#05080a">

<canvas id="c" style="position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#05080a;touch-action:none"></canvas>

<div id="diag" style="display:none;position:fixed;left:0;top:0;right:0;z-index:99999;background:#b00010;color:#fff;font:12px/1.45 monospace;padding:5px 7px;white-space:pre-wrap;word-break:break-all"></div>

<button id="snd" class="snd" type="button" aria-label="声音">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9.2v5.6h3.4L12.8 19V5L7.4 9.2H4z"/>
    <path class="wave" d="M16.2 8.6a4.8 4.8 0 0 1 0 6.8"/>
    <path class="wave" d="M18.9 6.2a8.4 8.4 0 0 1 0 11.6"/>
  </svg>
</button>

<div class="hint" id="hint" aria-hidden="true"><i></i><i></i><i></i></div>

<div class="veil" id="veil" style="position:fixed;left:0;top:0;right:0;bottom:0;background:#0a1416;display:flex;align-items:center;justify-content:center;z-index:40">
  <div class="veil-core"><span class="ring"></span><span class="orb"></span></div>
  <div class="track"><i id="prog"></i></div>
  <div id="err" hidden></div>
</div>

<script src="js/textures.js"></script>
<script src="js/shaders.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script>
(function () {
  "use strict";
  var NS = window.LIMINAL;
  var veil = document.getElementById("veil");
  var prog = document.getElementById("prog");
  var hint = document.getElementById("hint");
  var snd = document.getElementById("snd");
  var errEl = document.getElementById("err");
  var canvas = document.getElementById("c");

  var isReady = false;
  var entered = false;
  var api = null;

  /* ---- 诊断（仅在 URL 带 ?diag 时显示） ---- */
  var diagEl = document.getElementById("diag");
  var DIAG = location.search.indexOf("diag") >= 0;
  var dlines = [];
  function dlog(s) {
    dlines.push(String(s));
    if (dlines.length > 11) dlines.shift();
    if (DIAG && diagEl) {
      diagEl.style.display = "block";
      diagEl.textContent = dlines.join("\n");
    }
  }
  dlog("path " + location.pathname);
  dlog("ua " + (navigator.userAgent || "").slice(0, 64));
  try {
    var probe = document.createElement("canvas");
    var g2 = probe.getContext("webgl2");
    dlog("webgl2 " + (g2 ? "yes" : "NO"));
    if (g2) {
      var ext = g2.getExtension("EXT_color_buffer_float");
      dlog("floatRT " + (ext ? "yes" : "no") + " / " + (g2.getParameter(g2.VERSION) || ""));
    }
  } catch (e) {
    dlog("gl probe fail " + e.message);
  }
  window.addEventListener("error", function (ev) {
    dlog("ERR " + (ev.message || "") + " @" + (ev.lineno || 0));
  });

  function begin() {
    if (entered || !isReady) return;
    entered = true;
    NS.Audio.start();
    if (api) NS.Audio.setScene(api.scene());
    veil.classList.add("gone");
    setTimeout(function () { veil.style.display = "none"; }, 1400);
    hint.classList.add("show");
    setTimeout(function () { hint.classList.add("fade"); }, 4600);
    setTimeout(function () { hint.style.display = "none"; }, 6200);
  }

  /* 把诊断数据 POST 到本地 18801，用于无屏幕验证（仅 ?report 时） */
  function report(obj) {
    if (location.search.indexOf("report") < 0) return;
    var s = "";
    try { s = JSON.stringify(obj); } catch (e) { return; }
    /* 走 GET 信标：连本地静态服务器的访问日志，不依赖额外服务 */
    try {
      var im = new Image();
      im.src = "/__r?" + Date.now().toString(36) + ":" + encodeURIComponent(s);
    } catch (e) {}
    try {
      fetch("http://127.0.0.1:18801/report", { method: "POST", mode: "no-cors", body: s });
    } catch (e) {}
  }
  window.addEventListener("error", function (ev) {
    report({ ev: "js-error", msg: String(ev.message || "") + " @" + (ev.lineno || 0) });
  });

  NS.Engine.boot(canvas, {
    log: function (msg) { dlog("· " + msg); report({ ev: "log", msg: msg }); },
    report: report,
    progress: function (f) {
      prog.style.width = (f * 100).toFixed(1) + "%";
      if (f >= 1) dlog("asset+build 100%");
    },
    ready: function (a) {
      api = a;
      isReady = true;
      prog.style.width = "100%";
      veil.classList.add("ready");
      var sz = a && a.size ? a.size() : { w: 0, h: 0 };
      dlog("READY buf " + sz.w + "x" + sz.h + " css " + canvas.clientWidth + "x" + canvas.clientHeight);
      try {
        var cv = getComputedStyle(veil);
        var cb = getComputedStyle(document.body);
        dlog("veil bg=" + cv.backgroundColor + " op=" + cv.opacity + " z=" + cv.zIndex + " disp=" + cv.display);
        dlog("body bg=" + cb.backgroundColor + " h=" + document.body.offsetHeight);
      } catch (e2) {
        dlog("style read fail " + e2.message);
      }
      report({ ev: "ready", sz: a.size(), steps: a.steps() });
      if (DIAG) {
        setTimeout(function () { var s = a.probe(); dlog("px " + s); report({ ev: "px", s: s }); }, 900);
        setTimeout(function () { var s2 = a.probe(); dlog("px " + s2); report({ ev: "px2", s: s2 }); }, 2400);
      }
    },
    fatal: function (msg) {
      if (errEl) {
        errEl.hidden = false;
        errEl.textContent = msg;
      }
      if (prog) prog.parentNode.style.display = "none";
      dlog("FATAL " + msg);
    }
  });

  veil.addEventListener("pointerdown", begin, { passive: true });
  window.addEventListener("keydown", function (e) {
    if (!entered) begin();
    else if (e.key === "1" && api) api.next();
  });

  snd.addEventListener("click", function (e) {
    e.stopPropagation();
    if (!entered) begin();
    var m = !NS.Audio.isMuted();
    NS.Audio.setMuted(m);
    snd.classList.toggle("off", m);
  }, false);
  snd.addEventListener("pointerdown", function (e) { e.stopPropagation(); }, false);
})();
</script>
<script src="../../assets/fullscreen.js"></script>
</body>
</html>
