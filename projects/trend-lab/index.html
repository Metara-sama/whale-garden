<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfbfa">
<title>趋势实验室 · 搜索词频折线</title>
<meta name="description" content="输入任意词，看它在 8 个平台的搜索词频折线，时间自己拖。">
<link rel="icon" href="../../assets/favicon.png">
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<div class="page">

  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span>趋势实验室</div>
    <div class="top-meta" id="topMeta">8 平台 · 180 天</div>
  </header>

  <main>

    <section class="intro">
      <h1>输入一个词，看它在八个平台的走势。</h1>
      <p>时间自己拖，平台可以分开看，也可以合起来看。</p>
    </section>

    <section class="panel filter" aria-label="筛选">

      <div class="frow">
        <div class="wordbox">
          <input id="wordIn" type="text" placeholder="输入关键词，回车添加（最多 3 个）" autocomplete="off" maxlength="24" aria-label="关键词">
          <button type="button" id="wordAdd" aria-label="添加">＋</button>
        </div>
        <div class="chips" id="wordChips"></div>
      </div>

      <div class="frow">
        <div class="plats" id="platChips"></div>
        <button type="button" class="link" id="platAll">全选 / 全不选</button>
      </div>

      <div class="frow time">
        <div class="rng">
          <div class="rng-track"><div class="rng-fill" id="rngFill"></div></div>
          <input type="range" id="rA" min="0" max="179" value="150" step="1" aria-label="起始日期">
          <input type="range" id="rB" min="0" max="179" value="179" step="1" aria-label="结束日期">
        </div>
        <div class="rng-text" id="rngText">—</div>
      </div>

      <div class="frow tools">
        <div class="seg" id="quickBar">
          <button type="button" data-quick="7">7 天</button>
          <button type="button" data-quick="30">30 天</button>
          <button type="button" data-quick="90">90 天</button>
          <button type="button" data-quick="all">全部</button>
        </div>
        <div class="seg" id="grainSeg">
          <button type="button" data-grain="day">日</button>
          <button type="button" data-grain="week">周</button>
        </div>
        <div class="seg" id="segView">
          <button type="button" data-mode="merge">合计</button>
          <button type="button" data-mode="split">分平台</button>
          <button type="button" data-mode="facet">分面</button>
        </div>
        <button type="button" class="toggle" id="normChk">归一化</button>
        <button type="button" class="link" id="dlPng">存图</button>
        <button type="button" class="link" id="dlCsv">CSV</button>
      </div>

    </section>

    <section class="panel chartcard" aria-label="趋势图">
      <div class="stats" id="stats">
        <span>区间合计 <b id="kTotal">—</b></span>
        <span>峰值 <b id="kPeak">—</b></span>
        <span>走势 <b id="kSlope">—</b></span>
      </div>

      <div class="chart-wrap" id="chartWrap">
        <canvas id="chartCv"></canvas>
        <div class="tip" id="chartTip"></div>
        <div class="empty on" id="emptyHint">在上面输入一个词，曲线立刻出现</div>
      </div>

      <div class="legend" id="legend"></div>
    </section>

    <footer class="foot">
      曲线由词名确定性生成：同一个词每次打开都一样，各平台有自己的量级、周内节奏和滞后。它是演示数据，不是真实抓取的搜索量。
      <span class="foot-end">Whale's Garden · trend-lab</span>
    </footer>

  </main>

  <div class="flash" id="flashMsg" role="status" aria-live="polite"></div>
</div>

<script src="js/model.js?v=1"></script>
<script src="js/chart.js?v=2"></script>
<script src="js/app.js?v=5"></script>
<script src="../../assets/fullscreen.js"></script>
</body>
</html>
