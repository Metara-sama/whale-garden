<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🙇 功德点击器 · 股市飞升版</title>
<meta name="theme-color" content="#05050f">
<meta name="description" content="点一下是一拜，攒功德养寺庙，还能开户炒股再飞升。">
<link rel="icon" href="../../assets/favicon.png">
<style>
*{box-sizing:border-box}html,body{min-height:100%}:root{--glow:0 0 16px #00fff9}
body{margin:0;padding:0;min-height:100vh;overflow-x:hidden;font-size:16px;transition:background .8s,color .8s;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-tap-highlight-color:transparent}
#fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.drop{position:absolute;top:-12vh;animation:fall linear infinite;will-change:transform}
@keyframes fall{from{transform:translateY(-12vh) rotate(0)}to{transform:translateY(126vh) rotate(360deg)}}
#hud{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px);border-bottom:2px solid currentColor;flex-wrap:wrap}
#hud .mb{display:flex;flex-direction:column;line-height:1.15}
#mn{font-size:clamp(24px,4.4vw,38px);font-weight:900;letter-spacing:1px;text-shadow:var(--glow)}
#mc{font-size:13px;opacity:.72;font-weight:700;letter-spacing:.5px}
#chips-badge{display:none;font-size:13px;font-weight:800;letter-spacing:.5px;padding:6px 12px;border-radius:999px;border:2px solid currentColor;background:rgba(150,200,255,.2)}
#chips-badge.on{display:inline-block}
#buff-badge{display:none;font-size:13px;font-weight:800;letter-spacing:.5px;padding:6px 12px;border-radius:999px;border:2px solid currentColor;background:rgba(255,215,0,.18);animation:pulseBuff .9s ease-in-out infinite}
#buff-badge.on{display:inline-block}
@keyframes pulseBuff{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#ht{display:flex;gap:6px;flex-wrap:wrap}
#reset,#zero-btn,#sound-toggle,#simple-toggle,#export-btn,#import-btn{font:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;padding:6px 12px;border-radius:999px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.6;transition:opacity .2s,background .2s}
#reset:hover,#zero-btn:hover,#sound-toggle:hover,#simple-toggle:hover,#export-btn:hover,#import-btn:hover{opacity:1}
#simple-toggle.on,#sound-toggle.on{opacity:1;background:rgba(128,128,128,.2)}
#main{position:relative;z-index:2;display:flex;gap:18px;max-width:1180px;margin:0 auto;padding:18px 16px 90px;align-items:flex-start}
#left{flex:1 1 auto;min-width:0;text-align:center}
#shop{flex:0 0 380px;max-width:380px}
#sect{display:inline-block;padding:5px 18px;border-radius:999px;border:2px solid currentColor;font-size:14px;letter-spacing:2px;opacity:.85;margin-bottom:16px;font-weight:700}
#emoji-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;will-change:transform;cursor:pointer;user-select:none;line-height:1;padding:.06em .12em .16em}
#emoji{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla","EmojiOne Color","Segoe UI Symbol",sans-serif;
  font-size:clamp(88px,18vw,168px);line-height:1.35;display:inline-block;
  padding:.10em .12em .18em;vertical-align:middle;
  text-shadow:var(--glow);will-change:transform;transition:filter .15s
}
#emoji-wrap:active #emoji{filter:brightness(1.4)}
#emoji-wrap.crit-pop{animation:critPop .55s cubic-bezier(.28,.84,.42,1)}
@keyframes critPop{0%{transform:scale(1)}30%{transform:scale(1.4) rotate(-7deg)}60%{transform:scale(.9) rotate(5deg)}100%{transform:scale(1)}}
.shock{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;border:2px solid currentColor;pointer-events:none;animation:shockOut .65s ease-out forwards}
@keyframes shockOut{from{width:0;height:0;opacity:.9;transform:translate(-50%,-50%)}to{width:320px;height:320px;opacity:0;transform:translate(-50%,-50%)}}
.burst{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;pointer-events:none;box-shadow:0 0 10px currentColor;animation:burstOut .75s ease-out forwards}
@keyframes burstOut{from{transform:translate(-50%,-50%) scale(1.1);opacity:1}to{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(0);opacity:0}}
#way{font-size:clamp(24px,4.4vw,36px);margin:16px 0 6px;font-weight:900;letter-spacing:1.5px;line-height:1.2}
#meta{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#tag{display:inline-block;font-size:13px;letter-spacing:2px;padding:3px 12px;border-radius:8px;border:2px dashed currentColor;opacity:.75;font-weight:700}
#target{display:inline-block;font-size:13px;letter-spacing:.5px;padding:4px 14px;border-radius:999px;border:2px solid currentColor;font-weight:800;background:rgba(128,128,128,.14)}
#target .lbl{opacity:.6;font-weight:700;margin-right:5px;letter-spacing:1px}
#chant{font-size:clamp(15px,2.6vw,19px);margin:0 0 18px;min-height:1.5em;opacity:.9;line-height:1.5;font-weight:600}
#pray{padding:17px 46px;border-radius:999px;border:3px solid currentColor;background:transparent;color:inherit;font-size:20px;font-weight:800;font-family:inherit;letter-spacing:2px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .12s,background .25s,box-shadow .25s}
#pray:hover{transform:scale(1.05);background:rgba(128,128,128,.12);box-shadow:var(--glow)}
#pray:active{transform:scale(.93)}
#clickinfo{margin-top:10px;font-size:13px;opacity:.7;font-weight:700;letter-spacing:.5px}
#tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tab{flex:1;font:inherit;font-size:11.5px;font-weight:800;letter-spacing:.2px;padding:9px 4px;border-radius:10px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.45;transition:opacity .2s,background .2s;min-width:0}
.tab:hover{opacity:.8}
.tab.on{opacity:1;background:rgba(128,128,128,.18)}
.panel{display:none}
.panel.on{display:block}
.buy-row{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:12px;border:2px solid currentColor;background:rgba(128,128,128,.06);cursor:pointer;transition:background .15s,transform .1s,opacity .2s;opacity:.55}
.buy-row.can{opacity:1}
.buy-row.can:hover{background:rgba(128,128,128,.16)}
.buy-row.can:active{transform:scale(.98)}
.buy-row .ic{font-size:26px;flex:0 0 32px;text-align:center;line-height:1.3}
.buy-row .info{flex:1;min-width:0}
.buy-row .nm{font-size:14px;font-weight:800;letter-spacing:.5px;display:flex;justify-content:space-between;gap:8px}
.buy-row .nm .owned{opacity:.6;font-weight:700;font-size:12px}
.buy-row .sub{font-size:11.5px;opacity:.7;font-weight:600;margin-top:2px;line-height:1.35}
.buy-row .price{font-size:12.5px;font-weight:800;margin-top:3px;letter-spacing:.5px}
.buy-row .price.no{opacity:.5}
.buy-row .lvl{font-size:11px;font-weight:800;color:gold;margin-left:4px}
.lump-btn{flex:0 0 auto;font:inherit;font-size:12px;font-weight:800;padding:5px 9px;border-radius:8px;border:2px solid currentColor;background:rgba(150,220,255,.15);color:inherit;cursor:pointer;opacity:.9}
.lump-btn:disabled{opacity:.3;cursor:not-allowed}
#buyqty{display:flex;gap:6px;margin-bottom:10px;justify-content:flex-end}
#buyqty button{font:inherit;font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.5;transition:opacity .2s,background .2s}
#buyqty button.on{opacity:1;background:rgba(128,128,128,.2)}
.up-row{padding:10px 12px;margin-bottom:8px;border-radius:12px;border:2px solid currentColor;background:rgba(128,128,128,.06);cursor:pointer;transition:background .15s,opacity .2s;opacity:.55}
.up-row.can{opacity:1}
.up-row.can:hover{background:rgba(128,128,128,.16)}
.up-row .nm{font-size:14px;font-weight:800;letter-spacing:.5px}
.up-row .sub{font-size:12px;opacity:.72;font-weight:600;margin-top:3px;line-height:1.35}
.up-row .price{font-size:12.5px;font-weight:800;margin-top:4px}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ach{padding:8px 10px;border-radius:10px;border:2px solid currentColor;font-size:11.5px;font-weight:700;opacity:.32;transition:opacity .3s}
.ach.got{opacity:1;background:rgba(255,215,0,.12)}
.ach .an{font-size:12.5px;font-weight:800;margin-bottom:2px;display:block}
.sect-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sect-btn{font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.3px;padding:10px 6px;border-radius:10px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.45;transition:opacity .2s,background .2s;text-align:center}
.sect-btn:hover{opacity:.8}
.sect-btn.on{opacity:1;background:rgba(128,128,128,.2)}
.sect-btn .cc{display:block;font-size:11px;opacity:.75;margin-top:3px;font-weight:700}
/* 股市 */
.stock-sum{display:flex;justify-content:space-between;padding:10px 12px;margin-bottom:10px;border-radius:10px;border:2px solid currentColor;background:rgba(128,128,128,.08);font-size:11.5px;font-weight:800;gap:6px;flex-wrap:wrap}
.stock-sum>div{flex:1;text-align:center;min-width:80px}
#stock-qty{display:flex;gap:6px;margin-bottom:10px;justify-content:flex-end}
#stock-qty button{font:inherit;font-size:12px;font-weight:800;padding:5px 11px;border-radius:8px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.5;transition:opacity .2s,background .2s}
#stock-qty button.on{opacity:1;background:rgba(128,128,128,.2)}
.stock-row{padding:10px 12px;margin-bottom:8px;border-radius:12px;border:2px solid currentColor;background:rgba(128,128,128,.06)}
.stock-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.stock-emoji{font-size:22px;line-height:1.3;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color","Segoe UI Symbol",sans-serif}
.stock-name{flex:1;font-size:14px;font-weight:800;letter-spacing:.3px}
.stock-mode{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(128,128,128,.15);letter-spacing:.5px}
.stock-price-row{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.stock-price{font-size:18px;font-weight:900;letter-spacing:.5px}
.stock-change{font-size:13px;font-weight:800}
.stock-port{font-size:11.5px;opacity:.82;font-weight:700;margin-bottom:8px;line-height:1.4}
.stock-actions{display:flex;gap:6px;flex-wrap:wrap}
.stock-actions button{flex:1;min-width:60px;font:inherit;font-size:13px;font-weight:800;padding:8px;border-radius:8px;border:2px solid currentColor;background:rgba(128,128,128,.1);color:inherit;cursor:pointer;transition:background .15s,transform .1s}
.stock-actions button:hover:not(:disabled){background:rgba(128,128,128,.22)}
.stock-actions button:active:not(:disabled){transform:scale(.96)}
.stock-actions button:disabled{opacity:.3;cursor:not-allowed}
/* 中国股市习惯：买入/上涨用红，卖出/下跌用绿 */
.stock-actions button[data-buy]:hover:not(:disabled){background:rgba(239,68,68,.2)}
.stock-actions button[data-sell]:hover:not(:disabled){background:rgba(74,222,128,.2)}
.stock-actions button[data-short]:hover:not(:disabled){background:rgba(74,222,128,.2)}
.stock-actions button[data-close]:hover:not(:disabled){background:rgba(239,68,68,.2)}
.stock-locked{text-align:center;padding:24px 16px;opacity:.65;font-weight:700;font-size:13px;line-height:1.7}
.stock-locked .big{font-size:32px;margin-bottom:8px}
/* 飞升 */
.asc-card{padding:14px;margin-bottom:10px;border-radius:12px;border:2px solid currentColor;background:rgba(150,200,255,.08)}
.asc-card .big{font-size:28px;font-weight:900;letter-spacing:1px;text-shadow:var(--glow);line-height:1.1}
.asc-card .sub{font-size:12.5px;opacity:.75;font-weight:700;margin-top:4px;line-height:1.4}
.asc-btn{margin-top:10px;width:100%;font:inherit;font-size:15px;font-weight:800;letter-spacing:1px;padding:13px;border-radius:10px;border:3px solid currentColor;background:rgba(150,200,255,.18);color:inherit;cursor:pointer;transition:transform .15s,background .2s}
.asc-btn:hover:not(:disabled){transform:scale(1.02);background:rgba(150,200,255,.32)}
.asc-btn:disabled{opacity:.4;cursor:not-allowed}
.dragon-card{padding:12px;margin-bottom:10px;border-radius:12px;border:2px solid currentColor;background:rgba(255,180,80,.08)}
.dragon-card .dn{font-size:16px;font-weight:900;display:flex;justify-content:space-between;line-height:1.3}
.dragon-card .ds{font-size:12px;opacity:.75;font-weight:600;margin-top:3px;line-height:1.4}
.dragon-train{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dragon-train button{flex:1;font:inherit;font-size:12px;font-weight:800;padding:8px;border-radius:8px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.85;min-width:80px}
.dragon-train button:disabled{opacity:.3;cursor:not-allowed}
.aura-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.aura{font:inherit;font-size:11.5px;font-weight:800;padding:7px 8px;border-radius:8px;border:2px solid currentColor;background:transparent;color:inherit;cursor:pointer;opacity:.4;text-align:left}
.aura.on{opacity:1;background:rgba(150,200,255,.2)}
.pan-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pan-slot{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:10px;border:2px dashed currentColor;background:rgba(128,128,128,.08);cursor:pointer;opacity:.55;font-size:11px;font-weight:700;text-align:center;padding:6px}
.pan-slot.filled{opacity:1;border-style:solid;background:rgba(255,215,0,.12)}
.pan-slot.sel{outline:3px solid gold;outline-offset:1px}
.pan-slot .pi{font-size:28px;line-height:1.3;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color","Segoe UI Symbol",sans-serif}
.god-row{padding:9px 11px;margin-bottom:7px;border-radius:10px;border:2px solid currentColor;background:rgba(128,128,128,.06);cursor:pointer;opacity:.55;transition:opacity .2s,background .2s}
.god-row.unlocked{opacity:1}
.god-row.unlocked:hover{background:rgba(128,128,128,.16)}
.god-row .gn{font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.god-row .gd{font-size:11.5px;opacity:.72;font-weight:600;margin-top:2px;line-height:1.35}
.god-row .gl{font-size:11px;opacity:.6;font-weight:700;margin-top:2px}
/* 飞升树 / 自动化 */
.tree-row{padding:9px 11px;margin-bottom:7px;border-radius:10px;border:2px solid currentColor;background:rgba(128,128,128,.06);cursor:pointer;opacity:.6;transition:opacity .2s,background .2s}
.tree-row.can{opacity:1}
.tree-row.can:hover{background:rgba(128,128,128,.16)}
.tree-row.max{opacity:.45;cursor:default}
.tree-row .tn{font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.tree-row .td{font-size:11.5px;opacity:.72;font-weight:600;margin-top:2px;line-height:1.35}
.tree-row .tc{font-size:11px;font-weight:800;margin-top:3px;opacity:.85}
.wrinkler{position:absolute;width:44px;height:44px;display:grid;place-items:center;font-size:30px;cursor:pointer;user-select:none;z-index:5;filter:drop-shadow(0 0 8px #7a0000);animation:wrWobble 2s ease-in-out infinite;transition:transform .1s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color","Segoe UI Symbol",sans-serif;line-height:1.15}
.wrinkler:hover{transform:scale(1.15)}
@keyframes wrWobble{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-4px) rotate(4deg)}}
.golden{position:fixed;z-index:50;width:72px;height:72px;display:grid;place-items:center;font-size:46px;cursor:pointer;user-select:none;filter:drop-shadow(0 0 18px gold);animation:goldenFloat 2.4s ease-in-out infinite;transition:transform .15s;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","EmojiOne Color","Segoe UI Symbol",sans-serif;line-height:1.15}
.golden:hover{transform:scale(1.15)}
@keyframes goldenFloat{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}
#float-layer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
/* 弹幕层（膜拜对象弹幕） */
#danmaku-layer{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.danmaku{position:absolute;left:100vw;white-space:nowrap;font-weight:900;letter-spacing:1px;padding:5px 16px;border-radius:999px;border:2px solid currentColor;background:rgba(0,0,0,.42);backdrop-filter:blur(4px);text-shadow:0 0 10px currentColor;animation:danmakuFly linear forwards;will-change:transform}
@keyframes danmakuFly{to{transform:translateX(calc(-100vw - 100%))}}
/* 漂浮数字（已调大） */
.float{position:absolute;white-space:nowrap;font-weight:900;font-size:30px;pointer-events:none;animation:floatUp 1.6s cubic-bezier(.22,.68,.35,1) forwards;text-shadow:0 0 14px currentColor;letter-spacing:.5px}
.float.crit{font-size:44px;animation:critFloat 1.9s cubic-bezier(.22,.68,.35,1) forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.7)}18%{opacity:1;transform:translate(-50%,-16px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-120px) scale(1)}}
@keyframes critFloat{0%{opacity:0;transform:translate(-50%,0) scale(.5) rotate(-8deg)}15%{opacity:1;transform:translate(-50%,-18px) scale(1.4) rotate(4deg)}35%{opacity:1;transform:translate(-50%,-30px) scale(1.2) rotate(-2deg)}100%{opacity:0;transform:translate(-50%,-150px) scale(1.05)}}
body.crit-shake{animation:bodyShake .4s ease}
@keyframes bodyShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
#toast{position:fixed;left:50%;bottom:78px;transform:translate(-50%,14px);padding:10px 20px;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.82);color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;opacity:0;pointer-events:none;z-index:60;transition:opacity .25s,transform .25s;backdrop-filter:blur(6px);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#stat{position:fixed;left:0;right:0;bottom:10px;z-index:2;text-align:center;font-size:11.5px;letter-spacing:.4px;font-weight:600;opacity:.55;pointer-events:none;padding:0 14px;line-height:1.4}
.pose-orz{animation:p-orz 1s ease-in-out infinite}.pose-prostrate{animation:p-prostrate 1.5s ease-in-out infinite}.pose-koutou{animation:p-koutou 1.3s ease-in-out infinite}.pose-gongshou{animation:p-gongshou 1.1s ease-in-out infinite}.pose-hezhang{animation:p-hezhang 1.6s ease-in-out infinite}.pose-kneel{animation:p-kneel 1.4s ease-in-out infinite}.pose-twirl{animation:p-twirl 2s linear infinite}.pose-lie{animation:p-lie 2.2s ease-in-out infinite}.pose-backflip{animation:p-backflip 1.2s ease-in-out infinite}.pose-typing{animation:p-typing .28s steps(2) infinite}.pose-glitch{animation:p-glitch .36s steps(2) infinite}.pose-danmaku{animation:p-danmaku 2.4s ease-in-out infinite}.pose-cheers{animation:p-cheers 1.1s ease-in-out infinite}.pose-woodfish{animation:p-woodfish .7s ease-in-out infinite}.pose-dogeza{animation:p-dogeza 1.8s ease-in-out infinite}.pose-incense{animation:p-incense 2.6s ease-in-out infinite}.pose-handstand{animation:p-handstand 1.6s ease-in-out infinite}.pose-space{animation:p-space 3s ease-in-out infinite}.pose-clone{animation:p-clone 1.4s ease-in-out infinite}.pose-signal{animation:p-signal 1.2s ease-in-out infinite}.pose-gacha{animation:p-gacha 1.5s ease-in-out infinite}.pose-meditate{animation:p-meditate 3.5s ease-in-out infinite}.pose-dive{animation:p-dive 2.8s ease-in-out infinite}.pose-moon{animation:p-moon 2s cubic-bezier(.34,1.56,.64,1) infinite}.pose-snow{animation:p-snow 2.6s ease-in-out infinite}.pose-bath{animation:p-bath 2.2s ease-in-out infinite}.pose-fast{animation:p-fast .18s steps(2) infinite}
@keyframes p-orz{0%,100%{transform:rotate(0) translateY(0)}45%{transform:rotate(42deg) translateY(8%)}}
@keyframes p-prostrate{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(30%) scale(1.3,.55)}}
@keyframes p-koutou{0%{transform:translateY(-14%) rotate(-10deg)}40%{transform:translateY(26%) rotate(55deg)}70%{transform:translateY(-2%) rotate(-2deg)}100%{transform:translateY(-14%) rotate(-10deg)}}
@keyframes p-gongshou{0%,100%{transform:rotate(0) translateY(0)}50%{transform:rotate(20deg) translateY(5%)}}
@keyframes p-hezhang{0%,100%{transform:scale(1)}50%{transform:scale(1.15) translateY(-4%)}}

function maxBuyable(b,owned,money){
  if(!(money>0))return 0;
  const first=b.base*Math.pow(1.15,owned);
  let n=Math.floor(Math.log(1+money*0.15/first)/Math.log(1.15));
  if(!isFinite(n)||n<0)n=0;
  if(n>5000)n=5000;
  while(n>0&&buildingCost(b,owned,n)>money)n--;
  while(n<5000&&buildingCost(b,owned,n+1)<=money)n++;
  return n;
}
function fmt(n){
  if(!isFinite(n))return '∞';if(n<0)return '-'+fmt(-n);
  if(n===0)return '0';
  if(n<1)return n.toFixed(2);
  if(n<1000){if(n<10&&n%1!==0)return n.toFixed(2);if(n<100&&n%1!==0)return n.toFixed(1);return Math.floor(n).toString()}
  const u=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','Ud','Dd','Td','Qad'];
  let i=0;while(n>=1000&&i<u.length-1){n/=1000;i++}

}

/* 梭哈买入数量：二分法，无冲击封顶 */
function maxBuyQtyStock(id, merit){
  const def=STOCK_DEFS.find(d=>d.id===id);
  const st=S.stocks[id];
  if(!def||!st)return 0;
  const port=S.portfolio[id];
  let L;
  if(port.qty>0){L=port.leverage;}else{L=S.stockLeverage||1;}
  const f=stockFee();
  const p0=st.price;
  if(!(p0>0)||!(merit>0))return 0;
  let hi=Math.floor(merit/(p0*(1/L+f)))+1;
  if(hi<1)return 0;
  let lo=0;
  for(let i=0;i<80;i++){
    if(hi-lo<=1)break;
    const mid=Math.floor((lo+hi)/2);
    const imp=calcImpact(def, p0*mid);
    if(imp>700){ hi=mid; continue; }
    const fillPrice=p0*Math.exp(imp);
    const notional=fillPrice*mid;
    const pay=notional*(1/L+f);
    if(isFinite(pay)&&pay<=merit){ lo=mid; } else { hi=mid; }
  }
  return lo;
}
/* 梭哈做空数量：二分法 */
function maxShortQtyStock(id, merit){
  const def=STOCK_DEFS.find(d=>d.id===id);
  const st=S.stocks[id];
  if(!def||!st)return 0;
  const port=S.portfolio[id];
  let L;
  if(port.shortQty>0){L=port.shortLeverage;}else{L=S.stockLeverage||1;}
  const f=stockFee();
  const p0=st.price;
  if(!(p0>0)||!(merit>0))return 0;
  let hi=Math.floor(merit/(p0*(1/L+f)))+1;
  if(hi<1)return 0;
  let lo=0;
  for(let i=0;i<80;i++){
    if(hi-lo<=1)break;
    const mid=Math.floor((lo+hi)/2);
    const imp=calcImpact(def, p0*mid);
    if(imp>700){ hi=mid; continue; }
    const fillPrice=p0*Math.exp(-imp);
    const notional=fillPrice*mid;
    const pay=notional*(1/L+f);
    if(isFinite(pay)&&pay<=merit){ lo=mid; } else { hi=mid; }
  }

}

async function fetchJson(url){
  const ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  const to=ctl?setTimeout(()=>ctl.abort(),MKT_TIMEOUT_MS):null;
  try{
    const r=await fetch(url,ctl?{signal:ctl.signal,cache:'no-store'}:{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    return await r.json();
  }finally{ if(to)clearTimeout(to) }
}
/* 1 秒：只取最新价（约 300 字节） */
async function fetchPrices(){
  const url='https://data-api.binance.vision/api/v3/ticker/price?symbols='+encodeURIComponent(JSON.stringify(MKT_SYMBOLS));
  const arr=await fetchJson(url);
  if(!Array.isArray(arr))throw new Error('bad payload');
  const out=[];
  arr.forEach(o=>{
    const p=parseFloat(o.price);
    if(isFinite(p)&&p>0)out.push({sym:o.symbol,price:p});
  });
  if(!out.length)throw new Error('empty');
  return out;
}

async function fetchPricesGate(){
  const pairs=MKT_SYMBOLS.map(x=>x.replace('USDT','_USDT'));
  const arr=await Promise.all(pairs.map(p=>fetchJson('https://api.gateio.ws/api/v4/spot/tickers?currency_pair='+p)));

/* 5 分钟：1 分钟 K 线回填近 2 小时 */
async function fetchKlines(def){
  const url='https://data-api.binance.vision/api/v3/klines?symbol='+def.sym+'&interval=1m&limit='+KLINE_LIMIT;
  const arr=await fetchJson(url);
  if(!Array.isArray(arr))throw new Error('bad payload');
  const out=[];
  arr.forEach(k=>{
    if(!Array.isArray(k)||k.length<5)return;
    const t=+k[0], c=parseFloat(k[4]);
    if(isFinite(t)&&isFinite(c)&&c>0)out.push([t,c*def.mult]);
  });
  if(out.length<2)throw new Error('empty');
  return out;
}
function checkLiquidation(def,st){
  const port=S.portfolio[def.id];
  if(!port)return;
  if(port.qty>0&&port.leverage>1){
    const avgCost=port.cost/port.qty;
    const lossRatio=(avgCost-st.price)/avgCost*port.leverage;
    if(lossRatio>LIQ_LOSS_RATIO)liquidate(def,port);
  }
  if(port.shortQty>0&&port.shortLeverage>1){
    const avgShort=port.shortCost/port.shortQty;
    const lossRatio=(st.price-avgShort)/avgShort*port.shortLeverage;
    if(lossRatio>LIQ_LOSS_RATIO)liquidateShort(def,port);
  }
}
/* 把最新价写进状态与分钟序列 */
function applyTicks(list,src){
  let got=0;
  const now=Date.now();
  const bucket=Math.floor(now/60000)*60000;
  list.forEach(q=>{
    if(!q||!isFinite(q.price)||q.price<=0)return;
    const def=STOCK_DEFS.find(d=>d.sym===q.sym);
    if(!def)return;
    const st=S.stocks[def.id];
    if(!st)return;
    const p=q.price*def.mult;
    if(!isFinite(p)||p<=0)return;
    st.live=q.price;
    if(st.price>0)st.prevPrice=st.price; else st.prevPrice=0;
    st.price=p;
    st.ts=now;
    const tarr=TICKS[def.id]||(TICKS[def.id]=[]);
    tarr.push(p);
    if(tarr.length>TICK_HIST)tarr.shift();
    if(isFinite(q.pct))st.pct24=q.pct;
    const arr=CHARTS[def.id]||(CHARTS[def.id]=[]);
    if(arr.length&&arr[arr.length-1][0]===bucket)arr[arr.length-1][1]=p;
    else arr.push([bucket,p]);
    if(arr.length>KLINE_LIMIT)arr.splice(0,arr.length-KLINE_LIMIT);
    checkLiquidation(def,st);
    got++;
  });
  if(!got)throw new Error('no quote');
  const wasOk=MARKET.ok;
  MARKET.ok=true;MARKET.src=src;MARKET.at=now;MARKET.err='';MARKET.fails=0;
  mktFail=0;
  if(!wasOk){ if(currentTab==='stocks')renderStocks(); }
  else mktTickUI();
  flushLiquidations();
}
function marketAgeText(){
  if(!MARKET.at)return '—';

  if(s<2)return '刚刚';
  if(s<60)return s+' 秒前';
  return Math.round(s/60)+' 分钟前';
}

/* 折线图：近 2 小时 1 分钟 K + 实时点 */
function chartSvg(def, st){
  const arr=CHARTS[def.id]||[];
  const pts=arr.map(x=>x[1]);
  if(st.price>0)pts.push(st.price);
  if(pts.length<2)return '<div style="height:82px;display:grid;place-items:center;font-size:11px;opacity:.4;font-weight:700">等待行情数据…</div>';
  const w=320,h=82,pad=6;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<pts.length;i++){const v=pts[i];if(v<mn)mn=v;if(v>mx)mx=v}
  if(!(mx>mn))mx=mn+1;
  const span=mx-mn;
  const px=i=>pad+(i/(pts.length-1))*(w-pad*2);
  const py=v=>h-pad-((v-mn)/span)*(h-pad*2);
  let line='';
  for(let i=0;i<pts.length;i++)line+=(i?'L':'M')+px(i).toFixed(1)+' '+py(pts[i]).toFixed(1);
  const up=pts[pts.length-1]>=pts[0];
  const col=up?'#ef4444':'#4ade80';
  const gid='g'+def.id;
  const area=line+'L'+px(pts.length-1).toFixed(1)+' '+(h-pad)+'L'+px(0).toFixed(1)+' '+(h-pad)+'Z';
  const lastX=px(pts.length-1), lastY=py(pts[pts.length-1]);
  const first=arr.length?arr[0][0]:Date.now();
  const spanMin=Math.max(1,Math.round((Date.now()-first)/60000));
  let grid='';
  for(let i=1;i<4;i++){
    const y=(pad+(i/4)*(h-pad*2)).toFixed(1);
    grid+='<line x1="'+pad+'" y1="'+y+'" x2="'+(w-pad)+'" y2="'+y+'" stroke="currentColor" stroke-width="0.6" opacity="0.15"/>';
  }
  let svg='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:82px;display:block;margin:2px 0 4px">';

/* 秒级微图：最近 120 秒，每秒 1 点，波动被放大，肉眼能看见在动 */
function tickSvg(def, st){
  const arr=TICKS[def.id]||[];
  if(arr.length<2)return '<div style="height:34px"></div>';
  const w=320,h=34,pad=3;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<arr.length;i++){const v=arr[i];if(v<mn)mn=v;if(v>mx)mx=v}
  if(!(mx>mn)){mx=mn+1e-9}
  const span=mx-mn;
  const px=i=>pad+(i/(arr.length-1))*(w-pad*2);
  const py=v=>h-pad-((v-mn)/span)*(h-pad*2);
  let line='';
  for(let i=0;i<arr.length;i++)line+=(i?'L':'M')+px(i).toFixed(1)+' '+py(arr[i]).toFixed(1);
  const up=arr[arr.length-1]>=arr[0];
  const col=up?'#ef4444':'#4ade80';
  const lx=px(arr.length-1), ly=py(arr[arr.length-1]);
  let g='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:34px;display:block;margin:0 0 2px">';
  g+='<line x1="'+pad+'" y1="'+(h/2).toFixed(1)+'" x2="'+(w-pad)+'" y2="'+(h/2).toFixed(1)+'" stroke="currentColor" stroke-width="0.5" opacity="0.12"/>';
  g+='<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>';
  g+='<circle class="px-dot" cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2.4" fill="'+col+'"/>';
  g+='</svg>';
  g+='<div style="display:flex;justify-content:space-between;font-size:9.5px;opacity:.45;font-weight:700;margin:0 0 7px"><span>近 '+arr.length+' 秒 · 每秒</span><span>'+fmtPrice(mn)+' – '+fmtPrice(mx)+'</span></div>';
  return g;
}

/* 每秒：只结算持仓资金费，价格完全交给交易所 */
function tickMarket(dt){
  STOCK_DEFS.forEach(def=>{
    const port=S.portfolio[def.id];
    if(!port)return;
    if(port.qty>0&&port.leverage>1){
      const borrowed=port.cost-port.margin;
      if(borrowed>0){
        const interest=borrowed*FIN_RATE_PER_SEC*dt;
        S.merit-=interest;port.cost+=interest;
      }
    }
    if(port.shortQty>0&&port.shortLeverage>1){
      const borrowedShort=port.shortCost-port.shortMargin;
      if(borrowedShort>0){
        const interest=borrowedShort*FIN_RATE_PER_SEC*dt;
        S.merit-=interest;port.shortCost+=interest;
      }
    }
  });
}

/* 买入：冲击不封顶，exp 溢出保护 */
function buyStock(id, qty, isMax){
  const def=STOCK_DEFS.find(d=>d.id===id);
  const st=S.stocks[id];
  if(!def||!st||qty<=0)return;
  const port=S.portfolio[id];
  if(port.shortQty>0){toast('请先平空 '+def.n+' 再做多');return}

  let L;
  if(port.qty>0){L=port.leverage;}else{L=S.stockLeverage||1;}

  const fee=stockFee();
  const p0=st.price;
  if(!(p0>0)){toast('价格异常');return}

  function calcPay(q){
    const imp=calcImpact(def, p0*q);
    if(imp>700) return {ok:false};
    const fillPrice=p0*Math.exp(imp);
    const notional=fillPrice*q;
    const pay=notional*(1/L+fee);
    return {ok:isFinite(pay), imp, fillPrice, notional, margin:notional/L, feeAmt:notional*fee, pay};
  }

  let r=calcPay(qty);
  if(!r.ok){ toast('订单过大，市场无法承接'); return; }

  if(isMax){
    let guard=0;
    while(r.pay>S.merit && qty>1 && guard<200){
      qty--;
      guard++;
      r=calcPay(qty);
      if(!r.ok) break;
    }
  }

  if(!r.ok || qty<=0 || r.pay>S.merit){
    toast('功德不足（需保证金 '+fmt(r.margin||0)+' + 手续费 '+fmt(r.feeAmt||0)+'）');
    return;
  }


  S.merit -= r.pay;
  port.qty += qty;
  port.cost += r.notional;
  port.margin += r.margin;
  port.feePaid += r.feeAmt;
  port.leverage = L;
  S.stockBuys += 1;
  S.maxLeverageUsed = Math.max(S.maxLeverageUsed||1, L);
  sfxStock();vibrate(8);
  save();refreshHud();renderStocks();
  toast('📈 买入 '+qty+' 股 '+def.n+'（'+L+'x），保证金 '+fmt(r.margin)+' · 手续费 '+fmt(r.feeAmt));
}
/* 卖出（平多） */
function sellStock(id, qty){
  const def=STOCK_DEFS.find(d=>d.id===id);
  const st=S.stocks[id];
  const port=S.portfolio[id];
  if(!def||!st||!port||qty<=0)return;
  if(port.qty<qty)return;

  const fee=stockFee();
  const p0=st.price;
  const imp=calcImpact(def, p0*qty);
  const fillPrice=p0*Math.exp(-imp);

  const avgCost = port.cost/port.qty;
  const ratio = qty/port.qty;
  const marginOut = port.margin*ratio;
  const feePaidOut = port.feePaid*ratio;
  const notionalOut = fillPrice*qty;
  const feeAmt = notionalOut*fee;
  const pnl = qty*(fillPrice - avgCost);
  let revenue = marginOut + pnl - feeAmt;
  if(revenue<0)revenue=0;

  S.merit += revenue;
  S.totalEarned += revenue;
  S.allTimeEarned += revenue;
  const profit = revenue - marginOut - feePaidOut;
  if(profit>0){S.stockProfit+=profit;S.stockProfitThisRun+=profit;}

  port.cost -= avgCost*qty;
  port.margin -= marginOut;
  port.feePaid -= feePaidOut;
  port.qty -= qty;
  if(port.qty<=0){port.qty=0;port.cost=0;port.margin=0;port.leverage=1;port.feePaid=0}


  sfxStock();vibrate(8);
  save();refreshHud();renderStocks();
  toast('📉 卖出 '+qty+' 股 '+def.n+'，回收 '+fmt(revenue)+(profit>=0?' 盈利 +'+fmt(profit):' 亏损 '+fmt(profit)));
}

function sparkline(hist){
  if(!Array.isArray(hist)||hist.length<2)return '';
  const w=300,h=40;
  let min=Infinity,max=-Infinity;
  for(let i=0;i<hist.length;i++){if(hist[i]<min)min=hist[i];if(hist[i]>max)max=hist[i]}
  const span=(max-min)||1;
  const pts=[];
  for(let i=0;i<hist.length;i++){
    const x=(i/(hist.length-1))*w;
    const y=h-2-((hist[i]-min)/span)*(h-4);
    pts.push([x,y]);
  }
  let segs='';
  for(let i=1;i<pts.length;i++){
    const col=hist[i]>=hist[i-1]?'#ef4444':'#4ade80';
    segs+='<line x1="'+pts[i-1][0].toFixed(1)+'" y1="'+pts[i-1][1].toFixed(1)+'" x2="'+pts[i][0].toFixed(1)+'" y2="'+pts[i][1].toFixed(1)+'" stroke="'+col+'" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linecap="round"/>';
  }
  const lp=pts[pts.length-1];
  const lastCol=hist[hist.length-1]>=hist[hist.length-2]?'#ef4444':'#4ade80';
  const mark='<line x1="'+lp[0].toFixed(1)+'" y1="0" x2="'+lp[0].toFixed(1)+'" y2="'+h+'" stroke="'+lastCol+'" stroke-width="0.8" stroke-dasharray="2 2" vector-effect="non-scaling-stroke" opacity="0.5"/>';
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:42px;display:block;margin:2px 0 6px">'+segs+mark+'</svg>';
}

    else if(port.shortQty>0){

  stocksList.querySelectorAll('[data-buy]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.buy;
      if(stockQty==='max'){

        if(qty<=0){toast('功德不足');return}
        buyStock(id,qty,true);
      }else{
        buyStock(id,stockQty,false);
      }
    });
  });
  stocksList.querySelectorAll('[data-sell]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.sell;
      const port=S.portfolio[id];
      let qty;

  stocksList.querySelectorAll('[data-short]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.short;
      if(stockQty==='max'){
        const qty=maxShortQtyStock(id,S.merit);
        if(qty<=0){toast('功德不足');return}
        openShort(id,qty,true);
      }else{
        openShort(id,stockQty,false);
      }
    });
  });
  stocksList.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.close;
      const port=S.portfolio[id];
      let qty;

function doAscend(gain){

  S.ascensions+=1;
  S.merit=0;S.totalEarned=0;S.clicks=0;S.critCount=0;
  S.buildings=[0,0,0,0,0,0,0,0];

    S.portfolio[def.id]={
      qty:0,cost:0,margin:0,leverage:1,feePaid:0,
      shortQty:0,shortCost:0,shortMargin:0,shortLeverage:1,shortFeePaid:0
    };
  });
  wrinklers.forEach(w=>w.el&&w.el.remove());wrinklers=[];
  pendingLiquidation=[];

/* ================= Toast ================= */
let toastTimer=null,toastQueue=[],toastBusy=false;
function toast(msg){toastQueue.push(msg);if(!toastBusy)nextToast()}
function nextToast(){if(!toastQueue.length){toastBusy=false;return}toastBusy=true;const msg=toastQueue.shift();const el=$('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.classList.remove('on');setTimeout(nextToast,200)},1600)}
/* ================= 点击 ================= */
function doClick(silent){
  initAudio();
  S.clicks+=1;
  S.allTimeClicks=(S.allTimeClicks||0)+1;
  if(!silent){
    const now=Date.now();
    if(now-(S.lastClickTime||0)>COMBO_TIMEOUT)S.combo=0;
    S.lastClickTime=now;
    let wi;
    if(WAYS.length>1&&Math.random()<0.88){do{wi=Math.floor(Math.random()*WAYS.length)}while(wi===S.lastWay)}else wi=Math.floor(Math.random()*WAYS.length);
    S.lastWay=wi;currentWay=WAYS[wi];
    S.combo+=1;
    if(S.combo>S.maxCombo)S.maxCombo=S.combo;
    const firstTime=!S.seen.includes(currentWay.key);
    if(firstTime)S.seen.push(currentWay.key);
    S.wayUses[currentWay.key]=(S.wayUses[currentWay.key]||0)+1;
    const target=pickTarget();
    S.lastTarget=target;
    emojiEl.textContent=currentWay.e;
    setPose(emojiEl,currentWay.key);
    wayEl.textContent=currentWay.n;
    tagEl.textContent=currentWay.tag+(S.combo>=2?' · 连击 ×'+S.combo:'');
    renderTarget(target);
    chantEl.textContent='「'+currentWay.chant.replace(/\{name\}/g,target)+'」';
    spawnDanmaku('🙇 膜拜 '+target);
    const base=calcClickPower();
    const isCrit=Math.random()<critRate();
    const gain=base*(isCrit?critMult():1);
    S.merit+=gain;S.totalEarned+=gain;S.allTimeEarned+=gain;
    if(isCrit)S.critCount+=1;
    floatAt(gain,isCrit);
    if(isCrit){
      shockwave();burstParticles();critPop();critShake();sfxCrit();vibrate([20,40,20]);
      spawnDanmaku('💥 '+target+' 被虔诚暴击 ×'+critMult(),'#ffd54a');
    }else sfxClick();
    if(firstTime)toast('🎖 新姿势：'+currentWay.n+'（点击倍率 ×'+currentWay.mult+'）');
    if(S.combo>=10&&S.combo%10===0)tryStyleShift('连击 ×'+S.combo);
    save();refreshHud();refreshStat();checkAchievements(false);
  }else{
    const base=calcClickPower(true);
    const isCrit=Math.random()<critRate();
    const gain=base*(isCrit?critMult():1);
    S.merit+=gain;S.totalEarned+=gain;S.allTimeEarned+=gain;
    if(isCrit)S.critCount+=1;
  }
}

  el.style.left=(rect.left+rect.width/2+(Math.random()*80-40))+'px';
  el.style.top=(rect.top+rect.height*0.35)+'px';

}
function shockwave(){if(S.simple)return;const el=document.createElement('div');el.className='shock';emojiWrap.appendChild(el);setTimeout(()=>el.remove(),700)}
function burstParticles(){if(S.simple)return;const colors=['#ffd54a','#ff6b6b','#00fff9','#ff2fd0','#fff'];for(let i=0;i<12;i++){const p=document.createElement('div');p.className='burst';const a=Math.random()*Math.PI*2;const d=60+Math.random()*90;p.style.setProperty('--tx',(Math.cos(a)*d).toFixed(1)+'px');p.style.setProperty('--ty',(Math.sin(a)*d).toFixed(1)+'px');const c=colors[Math.floor(Math.random()*colors.length)];p.style.background=c;p.style.color=c;emojiWrap.appendChild(p);setTimeout(()=>p.remove(),800)}}
function critPop(){if(S.simple)return;emojiWrap.classList.remove('crit-pop');void emojiWrap.offsetWidth;emojiWrap.classList.add('crit-pop');setTimeout(()=>emojiWrap.classList.remove('crit-pop'),600)}
function critShake(){if(S.simple)return;document.body.classList.remove('crit-shake');void document.body.offsetWidth;document.body.classList.add('crit-shake');setTimeout(()=>document.body.classList.remove('crit-shake'),450)}
/* ================= 金木鱼 ================= */
function goldenDelay(){
  let base=45000+Math.random()*120000;
  if(S.activeAuras.includes('water'))base*=0.7;
  base/=(SECT_BONUS[S.sect].goldenFreq||1);
  return base;
}
function scheduleGolden(){setTimeout(spawnGolden,goldenDelay())}
function spawnGolden(){
  if(document.querySelector('.golden')){scheduleGolden();return}
  const el=document.createElement('div');
  el.className='golden';el.textContent='💰';
  el.style.left=(10+Math.random()*70)+'vw';
  el.style.top=(18+Math.random()*55)+'vh';
  el.addEventListener('click',e=>{e.stopPropagation();collectGolden();el.remove();scheduleGolden()});
  document.body.appendChild(el);
  setTimeout(()=>{if(el.parentNode){el.remove();scheduleGolden()}},15000);
}
function collectGolden(){
  S.goldenCount+=1;
  const roll=Math.random();
  let mult=1;
  if(S.pantheon.includes('guangong'))mult*=1.3;
  if(roll<0.35){S.buffUntil=Date.now()+15000;toast('🍀 幸运降临！15 秒内产出 ×7')}
  else if(roll<0.65){const gain=Math.max(calcCps()*15*13,calcClickPower()*77)*mult;S.merit+=gain;S.totalEarned+=gain;S.allTimeEarned+=gain;toast('💰 暴富！获得 '+fmt(gain)+' 功德')}
  else if(roll<0.85){S.clickBuffUntil=Date.now()+10000;toast('⚡ 点击风暴！10 秒内点击 ×7')}
  else{const i=Math.floor(Math.random()*BUILDINGS.length);const gain=BUILDINGS[i].cps*S.buildings[i]*60*mult;if(gain>0){S.merit+=gain;S.totalEarned+=gain;S.allTimeEarned+=gain;toast('🏗 '+BUILDINGS[i].n+' 爆发！+'+fmt(gain)+' 功德')}else{const g2=calcClickPower()*77*mult;S.merit+=g2;S.totalEarned+=g2;S.allTimeEarned+=g2;toast('💰 获得 '+fmt(g2)+' 功德')}}
  sfxGolden();vibrate([30,50,30]);
  spawnDanmaku('💰 金木鱼被 '+S.lastTarget+' 收下');
  save();refreshHud();refreshStat();checkAchievements(true);
  if(roll>=0.65&&roll<0.85)tryStyleShift('金木鱼');
}
/* ================= 业障 ================= */
function spawnWrinkler(){
  if(wrinklers.length>=10)return;
  const el=document.createElement('div');
  el.className='wrinkler';el.textContent='👹';
  const angle=Math.random()*Math.PI*2;
  const dist=90+Math.random()*40;
  const w0=emojiWrap.offsetWidth,h0=emojiWrap.offsetHeight;
  const cx=w0/2,cy=h0/2;
  const px=Math.max(0,Math.min(Math.max(0,w0-44),cx+Math.cos(angle)*dist-22));
  const py=Math.max(0,Math.min(Math.max(0,h0-44),cy+Math.sin(angle)*dist-22));
  el.style.left=px+'px';
  el.style.top=py+'px';
  const w={el,absorbed:0,id:Date.now()+Math.random()};
  el.addEventListener('click',e=>{e.stopPropagation();killWrinkler(w)});
  emojiWrap.appendChild(el);
  wrinklers.push(w);
}
function killWrinkler(w){
  const reward=w.absorbed*0.9;
  S.merit+=reward;S.totalEarned+=reward;S.allTimeEarned+=reward;
  S.wrinklerKills+=1;
  w.el.remove();
  const idx=wrinklers.indexOf(w);
  if(idx>=0)wrinklers.splice(idx,1);
  if(reward>0)toast('⚔️ 击杀业障！返还 +'+fmt(reward)+' 功德');
  sfxCrit();vibrate(15);
  spawnDanmaku('⚔️ '+S.lastTarget+' 斩业障 +'+fmt(reward));
  save();refreshHud();refreshStat();checkAchievements(false);
  if(S.wrinklerKills%5===0)tryStyleShift('击杀业障 ×'+S.wrinklerKills);
}
function updateWrinklers(dt){
  if(Date.now()>=nextWrinklerAt){
    if(wrinklers.length<10)spawnWrinkler();
    nextWrinklerAt=Date.now()+60000+Math.random()*120000;
  }
  const raw=baseCps();
  const drainPer=wrinklerDrainPer();
  wrinklers.forEach(w=>{w.absorbed+=raw*drainPer*dt});
}
function updateLumps(dt){
  let rate=1/1200;
  if(S.activeAuras.includes('earth'))rate*=1.25;
  rate*=(SECT_BONUS[S.sect].lump||1);
  S.lumpProgress+=dt*rate;
  while(S.lumpProgress>=1){S.lumpProgress-=1;S.lumps+=1;sfxLump();toast('💎 功德结晶 +1（共 '+S.lumps+' 颗）');save()}
}
/* ================= 自动购买 ================= */
function autoBuyTick(){
  const budget=S.merit*0.1;
  if(!(budget>0))return;
  let best=-1,bestRatio=-1;
  for(let i=0;i<BUILDINGS.length;i++){
    const c=buildingCost(BUILDINGS[i],S.buildings[i],1);
    if(c>budget)continue;
    const ratio=buildingYield(i)/c;
    if(ratio>bestRatio){bestRatio=ratio;best=i}
  }
  if(best>=0){
    const c=buildingCost(BUILDINGS[best],S.buildings[best],1);
    if(S.merit>=c){S.merit-=c;S.buildings[best]+=1}
  }
}
/* ================= 存档 / 设置 ================= */
function save(){
  if(suppressSave)return;
  S.lastSave=Date.now();
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(S))}catch(e){}
}
function applySimple(){
  document.body.classList.toggle('simple',S.simple);
  simpleBt.classList.toggle('on',S.simple);
  simpleBt.textContent=S.simple?'🎨 开':'🎨';
  if(S.simple)fxLayer.innerHTML='';
  else buildRain(currentSect.parts);
}
function applyMute(){
  soundBt.classList.toggle('on',!S.muted);
  soundBt.textContent=S.muted?'🔇':'🔊';
}
simpleBt.addEventListener('click',()=>{S.simple=!S.simple;save();applySimple();toast(S.simple?'已开启简约模式':'已关闭简约模式')});
soundBt.addEventListener('click',()=>{S.muted=!S.muted;if(!S.muted)initAudio();save();applyMute();toast(S.muted?'已静音':'音效已开启')});
function hardReset(){
  if(!confirm('⚠️ 彻底归零：将删除所有存档（功德、建筑、升级、股票、成就、天道、飞升、结晶、门派、姿势），且无法恢复。确定？'))return;
  if(!confirm('再次确认：真的要彻底归零吗？'))return;
  suppressSave=true;
  try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
  location.reload();
}
resetBt.addEventListener('click',hardReset);
zeroBt.addEventListener('click',()=>{
  if(!confirm('💣 功德归零：把当前功德和本周目累计清零（建筑、升级、股票持仓、成就、天道等保留）。确定？'))return;
  S.merit=0;
  S.totalEarned=0;
  save();
  refreshHud();
  refreshStat();
  if(currentTab==='buildings')renderBuildings();
  if(currentTab==='upgrades')renderUpgrades();
  if(currentTab==='stocks')renderStocks();
  toast('💣 功德已归零');
});
$('export-btn').addEventListener('click',()=>{
  try{
    save();
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    prompt('存档码（复制保存）：',code);
  }catch(e){toast('导出失败')}
});
$('import-btn').addEventListener('click',()=>{
  const code=prompt('粘贴存档码：');
  if(!code)return;
  try{
    const d=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!d||typeof d!=='object')throw new Error('bad');
    localStorage.setItem(STORAGE_KEY,JSON.stringify(d));
    suppressSave=true;
    location.reload();
  }catch(e){toast('存档码无效')}
});
/* ================= 交互锁 ================= */
document.addEventListener('pointerdown',()=>{interacting=true},{passive:true});
document.addEventListener('pointerup',()=>{setTimeout(()=>{interacting=false},250)},{passive:true});
document.addEventListener('pointercancel',()=>{setTimeout(()=>{interacting=false},250)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)lastTick=Date.now()});
/* ================= 标签 ================= */
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    currentTab=t.dataset.tab;
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
    $('panel-'+currentTab).classList.add('on');
    if(currentTab==='buildings')renderBuildings();
    if(currentTab==='upgrades')renderUpgrades();
    if(currentTab==='stocks')renderStocks();
    if(currentTab==='ascend')renderAscend();
    if(currentTab==='achieve')renderAchievements();
    if(currentTab==='sects')renderSects();
  });
});
document.querySelectorAll('#buyqty button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('#buyqty button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    buyQty=b.dataset.qty==='max'?'max':parseInt(b.dataset.qty,10);
    renderBuildings();
  });
});
/* ================= 主循环 ================= */
let lastTick=Date.now();
let uiAcc=0;
let stockAcc=0;
let stockUiAcc=0;
let achAcc=0;
let autoClickAcc=0;
let autoBuyAcc=0;
let lastMeritStr='',lastQtySnap=1;
function tick(){
  const now=Date.now();
  const dt=Math.min((now-lastTick)/1000,1);
  lastTick=now;
  const cps=calcCps();
  const gain=cps*dt;
  if(gain>0){S.merit+=gain;S.totalEarned+=gain;S.allTimeEarned+=gain}
  updateWrinklers(dt);
  updateLumps(dt);

  if(S.autoClick&&(S.heavenLevels.fing||0)>=3){
    autoClickAcc+=dt*0.5;
    let n=0;
    while(autoClickAcc>=1&&n<10){autoClickAcc-=1;doClick(true);n++}
  }
  if(S.autoBuy&&(S.heavenLevels.eff||0)>=5){
    autoBuyAcc+=dt;
    if(autoBuyAcc>=2){autoBuyAcc-=2;autoBuyTick()}
  }

  stockAcc+=dt;
  if(stockAcc>=1){
    const steps=Math.min(Math.floor(stockAcc),5);
    tickMarket(steps);
    stockAcc-=steps;
    flushLiquidations();
  }

  achAcc+=dt;
  if(achAcc>=1){achAcc=0;checkAchievements(true)}

  uiAcc+=dt;
  if(uiAcc>=0.12){
    uiAcc=0;
    refreshHud();
    refreshStat();
    const mStr=fmt(S.merit);
    if(!interacting&&(mStr!==lastMeritStr||buyQty!==lastQtySnap)){
      lastMeritStr=mStr;lastQtySnap=buyQty;
      if(currentTab==='buildings')renderBuildings();
      if(currentTab==='upgrades')renderUpgrades();
    }
  }
  stockUiAcc+=dt;
  if(currentTab==='stocks'&&stockUiAcc>=10){stockUiAcc=0;if(!interacting)renderStocks()}
}
setInterval(tick,100);
setInterval(save,10000);
window.addEventListener('beforeunload',()=>{if(!suppressSave)save()});
/* ================= 初始化 ================= */
(function init(){
  applySect(SECTS[S.sect]);
  const wi=Math.floor(Math.random()*WAYS.length);
  S.lastWay=wi;currentWay=WAYS[wi];
  emojiEl.textContent=currentWay.e;
  setPose(emojiEl,currentWay.key);
  wayEl.textContent=currentWay.n;
  tagEl.textContent=currentWay.tag;
  const tgt=pickTarget();S.lastTarget=tgt;
  renderTarget(tgt);
  chantEl.textContent='「'+currentWay.chant.replace(/\{name\}/g,tgt)+'」';
  applySimple();applyMute();
  renderBuildings();renderUpgrades();renderStocks();renderAscend();renderAchievements();renderSects();
  refreshHud();refreshStat();save();
  startMarket();
  nextWrinklerAt=Date.now()+60000;
  scheduleGolden();
  setTimeout(()=>spawnDanmaku('🙇 欢迎来到功德点击器'),1200);
  setTimeout(()=>checkAchievements(true),600);
})();
/* ================= 事件 ================= */
prayBtn.addEventListener('click',()=>doClick(false));
emojiWrap.addEventListener('click',e=>{if(e.target.closest('.wrinkler'))return;doClick(false)});
document.addEventListener('keydown',e=>{
  if((e.code==='Space'||e.key==='Enter')&&document.activeElement.tagName!=='BUTTON'&&document.activeElement.tagName!=='INPUT'){
    e.preventDefault();doClick(false);
  }
});
let rzT=null;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(!S.simple)buildRain(currentSect.parts)},320)});
})();
</script>
