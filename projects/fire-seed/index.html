<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>idle</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#03070a; --fg:#35ff85; --dim:#1d7a45; --dim2:#123f27;
    --warn:#ff6a6a; --line:#0c2a1a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
    -webkit-text-size-adjust:100%;overscroll-behavior:none;overflow:hidden}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:90;
    background:repeating-linear-gradient(180deg,rgba(53,255,133,.04) 0 1px,transparent 1px 3px);
    mix-blend-mode:screen;animation:breathe 5.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.4}50%{opacity:.72}}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:91;
    background:radial-gradient(120% 90% at 50% 45%,transparent 48%,rgba(0,0,0,.86) 100%)}

  #shell{position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 0 calc(8px + env(safe-area-inset-bottom))}

  /* 左上角命令行：常驻，输入文字可见 */
  #term{display:flex;align-items:baseline;gap:7px;padding:2px 12px 8px;
    border-bottom:1px solid transparent;transition:border-color .25s}
  body.awake #term{border-bottom-color:var(--line)}
  #ps1{color:var(--dim);white-space:nowrap;font-size:12.5px;flex:0 0 auto}
  #cmd{flex:1 1 auto;min-width:0;background:transparent;border:0;outline:0;
    color:var(--fg);font:inherit;font-size:14px;padding:1px 0;caret-color:var(--fg)}
  #cmd::placeholder{color:var(--dim2)}

  #idle{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    padding:0 12px 6px;pointer-events:none}
  #idle .ln{color:var(--dim2);font-size:11.5px;white-space:nowrap;overflow:hidden}

  #deck{flex:1;display:none;flex-direction:column;min-height:0;padding:8px 12px 0}
  body.awake #deck{display:flex}
  body.awake #idle{display:none}
  #out{flex:1 1 auto;min-height:0;overflow-y:auto;font-size:11.5px;line-height:1.72;
    color:#57c98a;white-space:pre-wrap;word-break:break-all;padding:4px 0 10px}
  #out .e{color:var(--warn)}
  #out .g{color:#8dffc0}
  #out .d{color:#276b48}
  #out .t{color:#7fe0ae}

  #acts{flex:0 0 auto;padding:10px 0 4px;border-top:1px solid var(--line)}
  .pw{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
  #pw{flex:1;background:transparent;border:0;border-bottom:1px solid #1a5c39;
    outline:0;color:#c9ffdf;font:inherit;font-size:14px;padding:6px 2px 7px}
  #pw:focus{border-bottom-color:#2ea86a}
  .btns{display:flex;gap:10px}
  button{flex:1 1 0;padding:15px 10px;border-radius:2px;border:1px solid #1a5c39;
    background:#04120b;color:#7dffb4;font:inherit;font-size:13px;letter-spacing:.1em;
    cursor:pointer;transition:.15s}
  button:hover:not(:disabled){background:#072b18;border-color:#2ea86a;color:#d6ffe7;
    box-shadow:0 0 18px rgba(46,168,106,.22)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{opacity:.32;cursor:not-allowed}
  button.up{background:#0a2216;border-color:#1f7a4a;color:#c8ffde}
  button.up:hover:not(:disabled){background:#0d3320;border-color:#35b16b}
  #meta{font-size:10.5px;color:var(--dim2);padding:2px 12px 0;letter-spacing:.04em}
</style>
</head>
<body>
<div id="shell">
  <div id="term">
    <span id="ps1">root@fs:~$</span>
    <input id="cmd" type="text" autocomplete="off" autocorrect="off" autocapitalize="off"
      spellcheck="false" enterkeyhint="send" placeholder="">
  </div>

  <div id="idle">
    <div class="ln">last login: — from 127.0.0.1</div>
  </div>

  <div id="deck">
    <pre id="out"></pre>
    <div id="acts">
      <div class="pw">
        <span style="color:var(--dim);font-size:12px">pass</span>
        <input id="pw" type="password" autocomplete="off" placeholder="passphrase">
      </div>
      <div class="btns">
        <button id="btnDown" type="button" disabled>↓ DOWNLOAD</button>
        <button id="btnUp" type="button" class="up" disabled>↑ UPLOAD</button>
      </div>
    </div>
  </div>

  <div id="meta"><span id="mSeed">seed --</span> · <span id="mTok">token off</span></div>
</div>

<div id="scan"></div><div id="vig"></div>

<input type="file" id="file" accept=".zip,application/zip" style="display:none">

<script>
(function () {
  'use strict';

  var AWAKEN = [
    '0fefc36b9f3ef7cab2b42187091823ae5ba72b4036d349a6a1e6b84163c563e4',
    '61203c92afff6dd018f82fedf796433b22625d6ad407f05b5b2e26bcde90d0ac'
  ];
  var MAGIC = new Uint8Array([0x46, 0x53, 0x44, 0x31]);
  var ITER = 200000;
  var SEED_URL = 'assets/seed.bin';
  var REPO = 'Metara-sama/whale-garden';
  var BRANCH = 'main';
  var SEED_PATH = 'projects/fire-seed/assets/seed.bin';
  var enc = new TextEncoder();

  var $ = function (id) { return document.getElementById(id); };
  var cmd = $('cmd'), out = $('out'), pw = $('pw');
  var awake = false, busy = false;

  function say(text, cls) {
    var span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = text + '\n';
    out.appendChild(span);
    while (out.childNodes.length > 600) out.removeChild(out.firstChild);
    out.scrollTop = out.scrollHeight;
  }
  function fmt(n) {
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1048576).toFixed(2) + ' MB';
  }
  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  }
  async function sha256(data) { return hex(await crypto.subtle.digest('SHA-256', data)); }
  function stamp() {
    var d = new Date(), p = function (n) { return ('0' + n).slice(-2); };
    return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
  }

  /* 暗语 */
  function canon(s) {
    return s.replace(/\s+/g, '').replace(/,/g, '，').replace(/\./g, '。');
  }
  async function tryAwaken() {
    var raw = cmd.value;
    if (!raw) return;
    var c = canon(raw);
    var max = Math.min(c.length, 16);
    for (var len = max; len >= 4; len--) {
      var tail = c.slice(c.length - len);
      var h = await sha256(enc.encode(tail));
      if (AWAKEN.indexOf(h) !== -1) { awaken(); return; }
    }
    if (cmd.value.length > 64) cmd.value = cmd.value.slice(-32);
  }
  cmd.addEventListener('input', function () { if (!awake) tryAwaken(); });
  cmd.addEventListener('compositionend', function () { if (!awake) tryAwaken(); });
  cmd.addEventListener('paste', function () { if (!awake) setTimeout(tryAwaken, 0); });

  function awaken() {
    if (awake) return;
    awake = true;
    cmd.value = '';
    document.body.classList.add('awake');
    say('link established. seed ' + SEED_URL, 'd');
    say('type "help" for commands.', 'd');
    loadStat();
    refreshTok();
    cmd.focus();
  }
  function sleepBack() {
    awake = false;
    document.body.classList.remove('awake');
    out.textContent = '';
    pw.value = '';
    cmd.value = '';
    cmd.focus();
  }

  /* 命令 */
  cmd.addEventListener('keydown', async function (e) {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    var line = cmd.value.trim();
    cmd.value = '';
    if (!awake || !line) return;
    say('root@fs:~$ ' + line, 'd');
    var sp = line.indexOf(' ');
    var c = sp < 0 ? line : line.slice(0, sp);
    var arg = sp < 0 ? '' : line.slice(sp + 1).trim();
    if (busy) { say('busy…', 'e'); return; }
    switch (c) {
      case 'help':
        say('commands:', 't');
        say('  token <PAT>   save github token (localStorage)');
        say('  token         show token state');
        say('  seed          re-read seed.bin info');
        say('  api           machine interface summary');
        say('  clear         clear console');
        say('  exit          close panel');
        break;
      case 'token':
        if (!arg) say('token: ' + (lsToken() ? 'on (' + lsToken().slice(0, 7) + '...)' : 'off'), lsToken() ? 'g' : 'd');
        else { localStorage.setItem('fs_gh_token', arg); refreshTok(); say('token saved.', 'g'); }
        break;
      case 'seed': await loadStat(); break;
      case 'api': printApi(); break;
      case 'clear': out.textContent = ''; break;
      case 'exit': sleepBack(); break;
      default: say('unknown command: ' + c + ' (try help)', 'e');
    }
  });

  function focusCmd() {
    if (document.activeElement !== pw) { try { cmd.focus({ preventScroll: true }); } catch (e) { cmd.focus(); } }
  }
  document.addEventListener('pointerdown', function (e) {
    if (e.target.tagName === 'BUTTON' || e.target === pw) return;
    setTimeout(focusCmd, 0);
  });
  window.addEventListener('load', focusCmd);

  async function loadStat() {
    try {
      var res = await fetch(SEED_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var b = new Uint8Array(await res.arrayBuffer());
      $('mSeed').textContent = 'seed ' + fmt(b.length);
      say('seed.bin ' + fmt(b.length) + '  sha256 ' + (await sha256(b)).slice(0, 16) + '...', 'd');
      $('btnDown').disabled = false;
      $('btnUp').disabled = !lsToken();
    } catch (e) {
      $('mSeed').textContent = 'seed ERR';
      say('seed.bin 读取失败：' + (e.message || e), 'e');
    }
  }

  function lsToken() { return localStorage.getItem('fs_gh_token') || ''; }
  function refreshTok() {
    var t = lsToken();
    $('mTok').textContent = t ? 'token on' : 'token off';
    $('btnUp').disabled = !t || busy;
  }

  /* FSD1 */
  async function deriveKey(password, salt, iter) {
    var base = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  function parseHeader(b) {
    if (b.length < 36) throw new Error('密文长度不足');
    for (var i = 0; i < 4; i++) if (b[i] !== MAGIC[i]) throw new Error('magic 不匹配');
    var iter = ((b[4] << 24) | (b[5] << 16) | (b[6] << 8) | b[7]) >>> 0;
    return { iter: iter, salt: b.slice(8, 24), iv: b.slice(24, 36) };
  }
  async function decryptSeed(b, password) {
    var h = parseHeader(b);
    var key = await deriveKey(password, h.salt, h.iter);
    var plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: h.iv, additionalData: MAGIC, tagLength: 128 }, key, b.slice(36));
    return new Uint8Array(plain);
  }
  async function encryptSeed(plain, password) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var key = await deriveKey(password, salt, ITER);
    var ct = new Uint8Array(await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: iv, additionalData: MAGIC, tagLength: 128 }, key, plain));
    var o = new Uint8Array(36 + ct.length);
    o.set(MAGIC, 0);
    o[4] = (ITER >>> 24) & 255; o[5] = (ITER >>> 16) & 255;
    o[6] = (ITER >>> 8) & 255; o[7] = ITER & 255;
    o.set(salt, 8); o.set(iv, 24); o.set(ct, 36);
    return o;
  }

  function u16(b, o) { return b[o] | (b[o + 1] << 8); }
  function zipCount(b) {
    for (var i = b.length - 22; i >= 0 && i > b.length - 66000; i--) {
      if (b[i] === 0x50 && b[i + 1] === 0x4b && b[i + 2] === 0x05 && b[i + 3] === 0x06) return u16(b, i + 10);
    }
    return -1;
  }

  /* DOWNLOAD */
  $('btnDown').addEventListener('click', async function () {
    var password = pw.value;
    if (!password) { say('passphrase 为空。', 'e'); pw.focus(); return; }
    busy = true; this.disabled = true; $('btnUp').disabled = true;
    try {
      say('fetch ' + SEED_URL + ' ...');
      var res = await fetch(SEED_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var cipher = new Uint8Array(await res.arrayBuffer());
      say('cipher ' + fmt(cipher.length) + ' -> PBKDF2 200k ...');
      var zip = await decryptSeed(cipher, password);
      say('decrypt ok, plain zip ' + fmt(zip.length), 'g');
      say('entries ' + zipCount(zip) + '  sha256 ' + (await sha256(zip)).slice(0, 16) + '...', 'd');
      var name = 'fire-seed-' + stamp() + '.zip';
      saveBlob(zip, name, 'application/zip');
      say('downloaded: ' + name, 'g');
    } catch (e) {
      say('解密失败：password 错误或密文被改动（' + (e.message || e) + '）', 'e');
    } finally { busy = false; this.disabled = false; refreshTok(); }
  });

  /* UPLOAD */
  $('btnUp').addEventListener('click', function () {
    if (!pw.value) { say('先填 passphrase。', 'e'); pw.focus(); return; }
    $('file').value = '';
    $('file').click();
  });
  $('file').addEventListener('change', async function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var password = pw.value;
    if (!password) { say('passphrase 为空。', 'e'); return; }
    if (!lsToken()) { say('token 未配置：命令行输入 token <PAT> 后重试。', 'e'); return; }
    busy = true; $('btnDown').disabled = true; $('btnUp').disabled = true;
    try {
      say('read ' + f.name + '（' + fmt(f.size) + '）...');
      var plain = new Uint8Array(await f.arrayBuffer());
      var n = zipCount(plain);
      if (n < 0) throw new Error('不是有效 zip');
      say('entries ' + n + ' -> encrypting ...');
      var seed = await encryptSeed(plain, password);
      say('cipher ' + fmt(seed.length) + ' sha256 ' + (await sha256(seed)).slice(0, 16) + '...', 'd');
      say('push ' + SEED_PATH + ' ...');
      var s = await ghPut(SEED_PATH, seed, 'fire-seed: update seed.bin');
      say('pushed, content sha ' + s + '（Pages 约 10 分钟生效）', 'g');
    } catch (e) {
      say('上传失败：' + (e.message || e), 'e');
    } finally { busy = false; $('btnDown').disabled = false; refreshTok(); }
  });

  /* GitHub */
  function b64(bytes) {
    var s = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(s);
  }
  async function ghPut(path, bytes, message) {
    var t = lsToken();
    if (!t) throw new Error('未配置 token');
    var api = 'https://api.github.com/repos/' + REPO + '/contents/' + path;
    var g = await fetch(api + '?ref=' + BRANCH, {
      headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json' }
    });
    var sha = null;
    if (g.status === 200) { var j = await g.json(); sha = j.sha; }
    else if (g.status !== 404) throw new Error('GET -> ' + g.status + '（token 权限不足？）');
    var body = { message: message, content: b64(bytes), branch: BRANCH };
    if (sha) body.sha = sha;
    var r = await fetch(api, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error('PUT ' + r.status + ' ' + (await r.text()).slice(0, 140));
    var o = await r.json();
    return o.content && o.content.sha ? o.content.sha.slice(0, 10) : 'ok';
  }

  function saveBlob(data, name, mime) {
    var url = URL.createObjectURL(new Blob([data], { type: mime || 'application/octet-stream' }));
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 5000);
  }
  function printApi() {
    var base = location.origin + location.pathname.replace(/[^/]*$/, '');
    say('SEED_URL = ' + base + 'assets/seed.bin', 'd');
    say('magic FSD1 | iter 200000 | salt16 | iv12 | AES-256-GCM(aad="FSD1")', 'd');
    say('key = PBKDF2-HMAC-SHA256(pass, salt, iter, 32)', 'd');
    say('python3 tools/fetch_seed.py ' + base + ' <pass> -o out.zip', 'd');
    say('target repo ' + REPO + '@' + BRANCH + ' :: ' + SEED_PATH, 'd');
  }
})();
</script>
</body>
</html>
