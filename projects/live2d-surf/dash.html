<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a1626" />
<title>谁在冲浪 · DASH</title>
<meta name="description" content="冲浪版无限跑酷：跳礁石、潜水躲海鸥，天气会自己变。" />
<link rel="stylesheet" href="dash.css" />
<script src="vendor/live2dcubismcore.min.js"></script>
<script src="vendor/pixi.min.js"></script>
<script src="vendor/cubism4.min.js"></script>
</head>
<body>
<div id="app">
  <div id="stage"></div>

  <!-- ============ UI 层 ============ -->
  <div id="ui">
    <a id="btn-back" href="index.html" title="返回冲浪测试器">←</a>

    <!-- 开始界面 -->
    <section id="ui-start" class="ui-screen">
      <div class="start-inner">
        <div class="logo">
          <h1>谁在冲浪</h1>
          <span class="dash">D A S H</span>
        </div>
        <p class="tips">
          <span class="k"><b>↑</b> / 上滑 / 点屏幕</span> 跳
          <span class="sep"></span>
          <span class="k"><b>↓</b> / 下滑</span> 下潜
        </p>
        <button id="btn-start" aria-label="开始">
          <svg viewBox="0 0 100 100"><polygon points="34,24 80,50 34,76" /></svg>
        </button>
        <p class="hint">躲开礁石和海鸥 · 浪越大分越高</p>
      </div>
      <div class="weather-tag" id="start-weather">☀ 晴</div>
    </section>

    <!-- 游戏中 HUD -->
    <div id="ui-hud" class="ui-hud">
      <div class="hud-score"><b id="hud-score">0</b><i>m</i></div>
      <div class="hud-right">
        <div class="hud-best">最佳 <b id="hud-best">0</b></div>
        <div class="hud-weather" id="hud-weather">☀</div>
      </div>
    </div>

    <!-- 结算 -->
    <section id="ui-over" class="ui-screen">
      <div class="over-inner">
        <h2 id="over-title">被浪拍中了</h2>
        <div class="over-score"><b id="over-score">0</b><i>m</i></div>
        <div class="over-row">
          <span>最佳 <b id="over-best">0</b> m</span>
          <span id="over-new" class="new-best">新纪录！</span>
        </div>
        <button id="btn-retry">▶ 再来一次</button>
      </div>
    </section>

    <!-- 加载中 -->
    <div id="ui-loading" class="ui-loading">
      <div class="spinner"></div>
      <span id="loading-text">正在起浪…</span>
    </div>
  </div>
</div>
<script src="dash.js"></script>
</body>
</html>
